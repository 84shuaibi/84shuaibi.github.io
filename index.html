<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>双人乒乓球 🏓</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2029;
    --accent: #4ade80;
    --accent2: #60a5fa;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
    padding: 20px;
  }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  .topbar { display: flex; align-items: center; gap: 16px; }
  .btn-group { margin-left: auto; display: flex; gap: 10px; }
  .ctrl-btn {
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
  }
  .ctrl-btn:hover { filter: brightness(1.2); }
  .ctrl-btn:active { transform: scale(.96); }
  .scoreboard {
    display: flex;
    gap: 60px;
    font-size: 44px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .scoreboard .p1 { color: var(--accent); }
  .scoreboard .p2 { color: var(--accent2); }
  .canvas-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  canvas { display: block; background: #0b0e13; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(11,14,19,.82);
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; font-weight: 700; }
  .overlay p { color: var(--muted); font-size: 14px; line-height: 1.7; }
  button {
    background: var(--accent);
    color: #0b0e13;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .1s, filter .1s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.96); }
  .controls {
    display: flex;
    gap: 50px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .controls b { color: var(--text); }
  .controls .c1 b { color: var(--accent); }
  .controls .c2 b { color: var(--accent2); }
  .match-info {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    min-height: 22px;
  }
  .match-info .sets { color: var(--text); }
  .mode-pick { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .mode-btn {
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .mode-btn.selected { border-color: var(--accent); color: var(--accent); }
  .mode-btn:hover { filter: brightness(1.15); }
  .match-pick { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 2px; }
  .match-btn {
    background: var(--panel); color: var(--text);
    padding: 8px 14px; font-size: 14px; font-weight: 600;
    border-radius: 8px; border: 2px solid transparent; cursor: pointer;
  }
  .match-btn.selected { border-color: var(--accent2); color: var(--accent2); background: rgba(96,165,250,0.10); }
  .match-btn:hover { filter: brightness(1.15); }
  .diff-pick { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 2px; }
  .diff-pick.show { display: flex; }
  .diff-btn {
    background: var(--panel); color: var(--text);
    padding: 8px 14px; font-size: 14px; font-weight: 600;
    border-radius: 8px; border: 2px solid transparent; cursor: pointer;
  }
  .diff-btn.selected { border-color: #f87171; color: #f87171; background: rgba(248,113,113,0.12); }
  .diff-btn:hover { filter: brightness(1.15); }
  .paddle-pick { display: flex; flex-direction: column; gap: 8px; align-items: center; margin: 2px 0; }
  .pp-row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .pp-label { font-size: 13px; font-weight: 700; min-width: 70px; text-align: right; }
  .pp-label.p1 { color: var(--accent); }
  .pp-label.p2 { color: var(--accent2); }
  .paddle-btn {
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .paddle-btn.selected { border-color: var(--accent2); color: var(--accent2); background: rgba(96,165,250,0.12); }
  .paddle-btn:hover { filter: brightness(1.15); }

  /* ===== 移动端 / 触屏适配 ===== */
  #game { touch-action: none; }
  .topbar { flex-wrap: wrap; }

  .rotate-hint {
    position: fixed; inset: 0; z-index: 999;
    background: #0f1419; color: #e6edf3;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px;
  }
  .rotate-hint .icon { font-size: 60px; line-height: 1; animation: rock 1.6s ease-in-out infinite; }
  @keyframes rock { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  .rotate-hint h2 { font-size: 20px; font-weight: 600; }
  .rotate-hint p { color: #8b949e; font-size: 14px; }

  @media (orientation: portrait) and (max-width: 900px) {
    .rotate-hint { display: flex; }
    body { overflow: hidden; }
  }

  @media (orientation: landscape) and (max-height: 520px) {
    html, body { height: 100%; }
    body { gap: 4px; padding: 6px 10px; justify-content: flex-start; overflow: hidden; overscroll-behavior: none; }
    h1 { font-size: 16px; }
    .ctrl-btn { padding: 6px 10px; font-size: 13px; }
    .scoreboard { gap: 30px; font-size: 30px; }
    .match-info { font-size: 13px; gap: 10px; }
    .canvas-wrap { border-radius: 8px; }
    .controls { display: none; }
    .overlay { overflow-y: auto; justify-content: flex-start; gap: 8px; padding: 10px; }
    .overlay h2 { font-size: 18px; }
    .overlay p { font-size: 11px; line-height: 1.5; }
    .paddle-btn, .mode-btn, .match-btn, .diff-btn { padding: 5px 9px; font-size: 12px; }
    button { padding: 10px 20px; font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="rotate-hint">
    <div class="icon">📱</div>
    <h2>请将手机旋转至横屏</h2>
    <p>本游戏需要横屏才能游玩</p>
  </div>
  <div class="topbar">
    <h1>🏓 双人乒乓球</h1>
    <div class="btn-group">
      <button class="ctrl-btn" id="muteBtn" title="背景音乐开关">🔊 音乐</button>
      <button class="ctrl-btn" id="pauseBtn" title="暂停 / 继续（空格）">⏸ 暂停</button>
      <button class="ctrl-btn" id="restartBtn" title="重新开始">🔄 重开</button>
      <button class="ctrl-btn" id="homeBtn" title="返回主页（重新设置）">🏠 主页</button>
      <button class="ctrl-btn" id="fsBtn" title="全屏并锁定横屏">🖥 全屏</button>
    </div>
  </div>
  <div class="scoreboard">
    <span class="p1" id="score1">0</span>
    <span class="p2" id="score2">0</span>
  </div>
  <div class="match-info">
    <span id="setNo">第 1 局</span>
    <span class="sets" id="setScore">盘分 0 : 0</span>
  </div>

  <div class="canvas-wrap">
    <canvas id="game" width="800" height="500"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">准备开始</h2>
      <p id="ovDesc">
        左侧玩家：<b>W/S</b> 上下 · <b>A/D</b> 前后<br>
        右侧玩家：<b>↑/↓</b> 上下 · <b>←/→</b> 前后<br>
        可斜向移动 · 球拍被限制在各自半场<br>
        触拍瞬间高速弹出，飞行中受阻力渐慢<br>
        每局 <b>11</b> 分 · <b>10 平后需连续领先 2 分</b><br>
        每位玩家可自选拍型：<b>⚡强力拍</b>出球快·移速慢 / <b>🌀迅捷拍</b>出球慢·移速快（已做平衡）<br>
        选择下方拍型与赛制后开始
      </p>
      <div class="paddle-pick" id="paddlePick">
        <div class="pp-row">
          <span class="pp-label p1">玩家1（左）</span>
          <button class="paddle-btn selected" data-pplayer="left" data-ptype="power">⚡ 强力拍 · 出球快</button>
          <button class="paddle-btn" data-pplayer="left" data-ptype="speed">🌀 迅捷拍 · 移速快</button>
        </div>
        <div class="pp-row">
          <span class="pp-label p2">玩家2（右）</span>
          <button class="paddle-btn" data-pplayer="right" data-ptype="power">⚡ 强力拍 · 出球快</button>
          <button class="paddle-btn selected" data-pplayer="right" data-ptype="speed">🌀 迅捷拍 · 移速快</button>
        </div>
      </div>
      <div class="match-pick" id="matchPick">
        <button class="match-btn selected" data-match="pvp">👥 双人对战</button>
        <button class="match-btn" data-match="ai">🤖 单人·人机</button>
      </div>
      <div class="diff-pick" id="aiDiffPick">
        <button class="diff-btn" data-diff="easy">😌 简单</button>
        <button class="diff-btn selected" data-diff="hell">🔥 地狱</button>
      </div>
      <div class="mode-pick" id="modePick">
        <button class="mode-btn" data-mode="single">单局 11分</button>
        <button class="mode-btn selected" data-mode="bo5">五局三胜</button>
        <button class="mode-btn" data-mode="bo7">七局四胜</button>
      </div>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="controls">
    <div class="c1">玩家1（左）<br><b>W/S</b> 上下 · <b>A/D</b> 前后</div>
    <div class="c2" id="p2ctrl">玩家2（右）<br><b>↑/↓</b> 上下 · <b>←/→</b> 前后</div>
  </div>

  // ===== 背景音乐 + 音效（Web Audio 实时合成，无需音频文件）=====
  const Music = (() => {
    let ctx = null, master = null, musicGain = null, sfxGain = null, voiceGain = null;
    let muted = false, playing = false, timer = null;
    let nextTime = 0, step = 0;

    const bpm = 132;
    const stepDur = 60 / bpm / 2; // 八分音符
    const lookahead = 0.12;

    const N = {
      C3:130.81, F3:174.61, G3:196.00, A3:220.00, E3:164.81,
      C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00,
      A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, G5:783.99
    };
    // 16 步旋律（2 小节），0 为休止
    const melody = [
      N.C5, N.E5, N.G5, N.E5, N.A4, N.C5, N.E5, N.C5,
      N.G4, N.B4, N.D5, N.B4, N.F4, N.A4, N.C5, N.A4
    ];
    const bass = [
      N.C3, 0, N.C3, 0, N.A3, 0, N.A3, 0,
      N.G3, 0, N.G3, 0, N.F3, 0, N.F3, 0
    ];

    function ensure() {
      if (ctx) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = muted ? 0 : 0.7; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = muted ? 0 : 0.9; sfxGain.connect(master);
      voiceGain = ctx.createGain(); voiceGain.gain.value = muted ? 0 : 1.0; voiceGain.connect(master);
    }

    function note(freq, time, dur, type, dest, vol) {
      if (!freq) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time);
      g.gain.linearRampToValueAtTime(vol, time + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g).connect(dest);
      osc.start(time);
      osc.stop(time + dur + 0.02);
    }

    function schedule() {
      while (nextTime < ctx.currentTime + lookahead) {
        const i = step % melody.length;
        note(melody[i], nextTime, stepDur * 0.9, 'triangle', musicGain, 0.18);
        note(bass[i], nextTime, stepDur * 0.9, 'sawtooth', musicGain, 0.09);
        nextTime += stepDur;
        step++;
      }
    }

    function start() {
      ensure();
      loadVoices();
      if (ctx.state === 'suspended') ctx.resume();
      if (playing) return;
      playing = true;
      step = 0;
      nextTime = ctx.currentTime + 0.06;
      timer = setInterval(schedule, 25);
    }

    function toggleMute() {
      muted = !muted;
      if (musicGain) musicGain.gain.value = muted ? 0 : 0.7;
      if (sfxGain) sfxGain.gain.value = muted ? 0 : 0.9;
      if (voiceGain) voiceGain.gain.value = muted ? 0 : 1.0;
      return muted;
    }

    function pause() { if (ctx && ctx.state === 'running') ctx.suspend(); }
    function resume() {
      if (ctx && ctx.state === 'suspended') ctx.resume();
      if (ctx) nextTime = ctx.currentTime + 0.06; // 避免恢复后补排一堆旧音符
    }

    function sfx(kind) {
      if (!ctx || muted) return;
      const t = ctx.currentTime;
      if (kind === 'hit') {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(660, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.05);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(g).connect(sfxGain);
        osc.start(t); osc.stop(t + 0.09);
      } else if (kind === 'score') {
        [523.25, 783.99].forEach((f, idx) => {
          const st = t + idx * 0.12;
          const osc = ctx.createOscillator(), g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = f;
          g.gain.setValueAtTime(0.0001, st);
          g.gain.linearRampToValueAtTime(0.35, st + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.2);
          osc.connect(g).connect(sfxGain);
          osc.start(st); osc.stop(st + 0.22);
        });
      }
    }

    let voiceBuffers = {};
    function b64ToAB(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr.buffer;
    }
    function loadVoices() {
      if (!ctx) return;
      for (const k of ['Three','Two','One','Go']) {
        if (voiceBuffers[k]) continue; // 已解码则跳过
        try {
          const ab = b64ToAB(VOICE_B64[k]);
          const res = ctx.decodeAudioData(ab);
          if (res && typeof res.then === 'function') {
            res.then((buf) => { voiceBuffers[k] = buf; }).catch(() => {});
          } else {
            ctx.decodeAudioData(ab, (buf) => { voiceBuffers[k] = buf; }, () => {});
          }
        } catch (e) { /* 解码失败时静默跳过 */ }
      }
    }
    function announce(text) {
      if (muted || !ctx) return;
      const buf = voiceBuffers[text];
      if (!buf) return; // 尚未解码完成则不播，不阻塞游戏
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(voiceGain || master);
      src.start(0);
    }

    // 页面加载即预解码真人发音，确保开局第一声 "Three" 不延迟
    try { ensure(); loadVoices(); } catch (e) {}
    return { start, toggleMute, pause, resume, sfx, announce };
  })();

  const left = { x: 24, y: H/2 - PADDLE_H/2, score: 0, type: 'power' };
  const right = { x: W - 24 - PADDLE_W, y: H/2 - PADDLE_H/2, score: 0, type: 'speed' };
  const ball = { x: W/2, y: H/2, vx: 0, vy: 0, speed: SERVE_SPEED };

  const keys = {};
  let running = false;
  let gameOver = false;
  let paused = false;
  let rally = 0; // 连续回合计数，用于加速
  // 小球拖尾与触拍闪光
  const trail = [];
  const TRAIL_LEN = 16;
  const P1_COLOR = '#4ade80', P2_COLOR = '#60a5fa'; // 阵营描边/发光色：P1 绿 · P2 蓝
  let flash = 0, flashX = 0, flashY = 0, flashColor = P1_COLOR, ballGlowColor = P1_COLOR;
  // 每分开始前的发球倒计时
  let serveCountdown = 0;  // >0 时球冻结在中心
  let goTimer = 0;         // "GO!" 提示残留时间
  let pendingDir = 1;      // 倒计时结束后的发球方向
  let lastCountNum = 0;    // 上一次报数的数字，用于检测切换

  // ===== 比赛模式（每局 11 分，赢够局数者获胜）=====
  const MODES = {
    single: { name: '单局 11 分', setsToWin: 1 },
    bo5:    { name: '五局三胜', setsToWin: 3 },
    bo7:    { name: '七局四胜', setsToWin: 4 },
  };
  let mode = 'bo5';
  let matchMode = 'pvp'; // 'pvp' 双人对战 · 'ai' 人机对战（P1=真人 WASD，P2=电脑）
  let leftSets = 0, rightSets = 0, setIndex = 1;
  let lastLoser = null;             // 上一分失分方：'p1' / 'p2'；null = 开局随机
  let setMsg = '', setMsgTimer = 0; // 本局结束后的过场提示

  function updateSetScore() {
    if (setNoEl) setNoEl.textContent = `第 ${setIndex} 局`;
    if (setScoreEl) setScoreEl.textContent = `盘分 ${leftSets} : ${rightSets}`;
  }

  // 下一分发球方向：朝向「上一球失分的人」（失分方接发）；开局随机
  function nextServeDir() {
    if (lastLoser === 'p1') return -1; // 飞向左，朝向失分方 P1
    if (lastLoser === 'p2') return 1;  // 飞向右，朝向失分方 P2
    return Math.random() < 0.5 ? -1 : 1;
  }

  function resetBall(dir) {
    ball.x = W/2;
    ball.y = H/2;
    ball.speed = SERVE_SPEED;
    rally = 0;
    trail.length = 0;
    flash = 0;
    ballGlowColor = (dir > 0) ? P1_COLOR : P2_COLOR; // 飞向右=P1 发球 → 绿光
    ball.vx = 0; ball.vy = 0;
    pendingDir = dir;
    serveCountdown = 3; // 发球前 3 秒倒计时，球冻结在中心
    lastCountNum = 0;  // 重置报数追踪，使进入倒计时时重新报 "Three"
  }

  // 倒计时结束，正式把球发出去
  function launchBall() {
    const angle = (Math.random() * 0.6 - 0.3); // -0.3 ~ 0.3 弧度
    ball.vx = pendingDir * ball.speed * Math.cos(angle);
    ball.vy = ball.speed * Math.sin(angle);
    goTimer = 0.7;
    Music.announce('Go');
  }

  function startGame() {
    left.score = 0; right.score = 0;
    leftSets = 0; rightSets = 0; setIndex = 1;
    scoreEl1.textContent = '0';
    scoreEl2.textContent = '0';
    updateSetScore();
    // 复位球拍到初始位置
    left.x = 24; left.y = H/2 - PADDLE_H/2;
    right.x = W - 24 - PADDLE_W; right.y = H/2 - PADDLE_H/2;
    gameOver = false;
    paused = false;
    setMsg = ''; setMsgTimer = 0;
    pauseBtn.textContent = '⏸ 暂停';
    overlay.classList.add('hidden');
    lastLoser = null;                 // 开局无「上一分」，首分随机发球
    resetBall(nextServeDir());
    running = true;
    Music.start(); // 点击「开始」后启动音频（满足浏览器自动播放策略）
    requestAnimationFrame(loop);
  }

  // 一键返回主页（设置页）：停止当前对局并还原主页，保留已选模式/难度/拍型
  function goHome() {
    running = false;
    gameOver = false;
    paused = false;
    pauseBtn.textContent = '⏸ 暂停';
    // 复位对局状态，让主页显示干净
    left.score = 0; right.score = 0;
    leftSets = 0; rightSets = 0; setIndex = 1;
    left.x = 24; left.y = H/2 - PADDLE_H/2;
    right.x = W - 24 - PADDLE_W; right.y = H/2 - PADDLE_H/2;
    scoreEl1.textContent = '0';
    scoreEl2.textContent = '0';
    updateSetScore();
    // 还原主页文案（endGame 会改写 ovTitle/ovDesc/startBtn）
    ovTitle.textContent = HOME_TITLE;
    ovDesc.innerHTML = HOME_DESC;
    startBtn.textContent = HOME_START;
    updateDiffVisibility(); // 难度选项显示与当前对战模式保持一致
    overlay.classList.remove('hidden');
  }

  function endGame(winner) {
    gameOver = true;
    running = false;
    const champ = (winner === 'p1') ? '🟢 玩家1' : (matchMode === 'ai' ? '🔵 电脑 AI' : '🔵 玩家2');
    ovTitle.textContent = `${champ} 获胜！`;
    if (mode === 'single') {
      ovDesc.innerHTML = `最终比分　<b>${left.score} : ${right.score}</b><br>点击按钮再来一局`;
    } else {
      ovDesc.innerHTML = `${MODES[mode].name} · 最终盘分　<b>${leftSets} : ${rightSets}</b><br>点击按钮再来一局`;
    }
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
    updateSetScore();
  }

  // 某一局结束：结算盘分，决定是否比赛结束，否则进入下一局过场
  function onSetWon(winner) {
    if (winner === 'p1') leftSets++; else rightSets++;
    updateSetScore();
    const target = MODES[mode].setsToWin;
    if (leftSets >= target || rightSets >= target) {
      endGame(winner);
      return;
    }
    // 进入下一局：先显示过场提示，倒计时结束后开球
    const who = (winner === 'p1') ? '🟢 玩家1' : (matchMode === 'ai' ? '🔵 电脑 AI' : '🔵 玩家2');
    setMsg = `${who} 拿下第 ${setIndex} 局！`;
    setIndex++;
    left.score = 0; right.score = 0;
    scoreEl1.textContent = '0';
    scoreEl2.textContent = '0';
    updateSetScore(); // 显示即将开始的新一局
    ball.x = W/2; ball.y = H/2; ball.vx = 0; ball.vy = 0;
    trail.length = 0; flash = 0;
    setMsgTimer = 1.8;
  }

  // ===== 人机对战：AI 控制右侧球拍（高难度）=====
  let aiErr = 0, aiErrTimer = 0;
  function predictBallY(px) {
    let x = ball.x + BALL_SIZE/2, y = ball.y + BALL_SIZE/2;
    let vx = ball.vx, vy = ball.vy;
    if (vx <= 0) return H/2; // 球未飞向 AI，无需预测
    let guard = 0;
    while (x < px && guard++ < 2000) {
      x += vx; y += vy;
      if (y < 0) { y = -y; vy = -vy; }
      else if (y > H) { y = 2*H - y; vy = -vy; }
    }
    return y;
  }
  function aiControl(dt, rm) {
    const speed = PADDLE_SPEED * rm;
    const xspeed = PADDLE_X_SPEED * rm;
    const lvl = AI_LEVELS[aiDifficulty];
    // 低频刷新瞄准误差，避免逐帧抖动
    aiErrTimer -= dt;
    if (aiErrTimer <= 0) { aiErr = (Math.random() - 0.5) * lvl.err; aiErrTimer = 0.25; }
    // 纵向：球飞来时预测落点并主动打角度，否则回中
    let targetY = H/2;
    if (ball.vx > 0) {
      const py = predictBallY(right.x);
      const aimSign = (left.y + PADDLE_H/2 < H/2) ? -1 : 1; // 真人在上 → AI 把球打向下
      targetY = py + aimSign * lvl.aim + aiErr;
    } else {
      targetY = H/2 + aiErr * 0.3;
    }
    targetY = Math.max(PADDLE_H/2, Math.min(H - PADDLE_H/2, targetY));
    const dy = targetY - (right.y + PADDLE_H/2);
    right.y += Math.sign(dy) * Math.min(Math.abs(dy), speed);
    // 前后：球逼近时前压逼近中线，否则回撤伺机
    const targetX = (ball.vx > 0 && ball.x > W * 0.45) ? RIGHT_MIN_X + 8 : W * 0.80;
    const dx = targetX - right.x;
    right.x += Math.sign(dx) * Math.min(Math.abs(dx), xspeed);
  }

  function update(dt) {
    if (goTimer > 0) goTimer -= dt;
    // 挡板移动（上下 + 前后，可斜向移动；速度按所选拍型缩放）
    const lm = PADDLE_TYPES[left.type].moveMul;
    const rm = PADDLE_TYPES[right.type].moveMul;
    if (keys['w']) left.y -= PADDLE_SPEED * lm;
    if (keys['s']) left.y += PADDLE_SPEED * lm;
    if (keys['a']) left.x -= PADDLE_X_SPEED * lm;   // 后退（远离中线）
    if (keys['d']) left.x += PADDLE_X_SPEED * lm;   // 前进（逼近中线）
    if (matchMode === 'ai') {
      aiControl(dt, rm); // 人机模式：右侧由 AI 接管
    } else {
      if (keys['arrowup']) right.y -= PADDLE_SPEED * rm;
      if (keys['arrowdown']) right.y += PADDLE_SPEED * rm;
      if (keys['arrowleft']) right.x -= PADDLE_X_SPEED * rm;   // 前进（逼近中线）
      if (keys['arrowright']) right.x += PADDLE_X_SPEED * rm;  // 后退（远离中线）
    }
    // 限制在各自半场范围内
    left.y = Math.max(0, Math.min(H - PADDLE_H, left.y));
    right.y = Math.max(0, Math.min(H - PADDLE_H, right.y));
    left.x = Math.max(LEFT_MIN_X, Math.min(LEFT_MAX_X, left.x));
    right.x = Math.max(RIGHT_MIN_X, Math.min(RIGHT_MAX_X, right.x));

    // 本局结束后的过场：球冻结，提示谁拿下本局，计时结束后开下一局
    if (setMsgTimer > 0) {
      setMsgTimer -= dt;
      if (setMsgTimer <= 0) {
        setMsg = '';
        resetBall(nextServeDir()); // 下一局首分朝向「上一分失分方」
      }
      return;
    }

    // 发球倒计时：球冻结在中心，倒计时结束后才发出
    if (serveCountdown > 0) {
      serveCountdown -= dt;
      const n = Math.ceil(serveCountdown);
      if (n !== lastCountNum) { // 数字切换时英文报数
        lastCountNum = n;
        if (n === 3) Music.announce('Three');
        else if (n === 2) Music.announce('Two');
        else if (n === 1) Music.announce('One');
      }
      if (serveCountdown <= 0) {
        serveCountdown = 0;
        launchBall();
      }
      return;
    }

    // 球移动
    ball.x += ball.vx;
    ball.y += ball.vy;

    // 阻力：飞行途中速度逐渐衰减，并设下限保证可玩
    ball.speed *= DRAG;
    if (ball.speed < MIN_SPEED) ball.speed = MIN_SPEED;
    const mag = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx = ball.vx / mag * ball.speed;
    ball.vy = ball.vy / mag * ball.speed;

    // 记录拖尾轨迹
    trail.push({ x: ball.x + BALL_SIZE/2, y: ball.y + BALL_SIZE/2 });
    if (trail.length > TRAIL_LEN) trail.shift();
    if (flash > 0) flash -= 0.045;

    // 上下墙反弹
    if (ball.y <= 0) { ball.y = 0; ball.vy = Math.abs(ball.vy); }
    if (ball.y + BALL_SIZE >= H) { ball.y = H - BALL_SIZE; ball.vy = -Math.abs(ball.vy); }

    // 左挡板碰撞
    if (ball.vx < 0 &&
        ball.x <= left.x + PADDLE_W &&
        ball.x >= left.x &&
        ball.y + BALL_SIZE >= left.y &&
        ball.y <= left.y + PADDLE_H) {
      ball.x = left.x + PADDLE_W;
      bounce(left);
    }

    // 右挡板碰撞
    if (ball.vx > 0 &&
        ball.x + BALL_SIZE >= right.x &&
        ball.x + BALL_SIZE <= right.x + PADDLE_W &&
        ball.y + BALL_SIZE >= right.y &&
        ball.y <= right.y + PADDLE_H) {
      ball.x = right.x - BALL_SIZE;
      bounce(right);
    }

    // 得分判定
    if (ball.x + BALL_SIZE < 0) { // 球出左界，玩家2得分，玩家1失分
      right.score++;
      scoreEl2.textContent = right.score;
      lastLoser = 'p1';
      Music.sfx('score');
      if (right.score >= WIN_SCORE && right.score - left.score >= 2) { onSetWon('p2'); return; }
      resetBall(nextServeDir());
    }
    if (ball.x > W) { // 球出右界，玩家1得分，玩家2失分
      left.score++;
      scoreEl1.textContent = left.score;
      lastLoser = 'p2';
      Music.sfx('score');
      if (left.score >= WIN_SCORE && left.score - right.score >= 2) { onSetWon('p1'); return; }
      resetBall(nextServeDir());
    }
  }

  function bounce(paddle) {
    rally++;
    // 触拍后重新加速（出拍速度更快），并随回合轻微递增
    const extra = Math.min(rally, LAUNCH_RAMP_CAP) * LAUNCH_RAMP;
    const mul = PADDLE_TYPES[paddle.type].launchMul;
    ball.speed = (LAUNCH_SPEED + extra) * mul;
    // 根据击中挡板的位置改变反弹角度
    const rel = (ball.y + BALL_SIZE/2 - (paddle.y + PADDLE_H/2)) / (PADDLE_H/2); // -1 ~ 1
    const maxAngle = Math.PI / 3; // 60度
    const angle = rel * maxAngle;
    const dir = (paddle === left) ? 1 : -1;
    ball.vx = dir * ball.speed * Math.cos(angle);
    ball.vy = ball.speed * Math.sin(angle);
    flash = 1;
    flashX = ball.x + BALL_SIZE/2;
    flashY = ball.y + BALL_SIZE/2;
    flashColor = (paddle === left) ? P1_COLOR : P2_COLOR;
    ballGlowColor = flashColor;
    Music.sfx('hit');
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 玩家拍型标签（左上 / 右上角）
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4ade80';
    ctx.fillText(`P1 ${PADDLE_TYPES[left.type].icon}${PADDLE_TYPES[left.type].name}`, 16, 22);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#60a5fa';
    const p2tag = (matchMode === 'ai' ? '🤖 ' : ' P2');
    ctx.fillText(`${PADDLE_TYPES[right.type].name}${PADDLE_TYPES[right.type].icon}${p2tag}`, W - 16, 22);
    ctx.textAlign = 'left';

    // 中线
    ctx.strokeStyle = 'rgba(196,181,253,0.30)'; // 中线：淡紫灰
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 14]);
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // 挡板
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(left.x, left.y, PADDLE_W, PADDLE_H);
    ctx.fillStyle = '#60a5fa';
    ctx.fillRect(right.x, right.y, PADDLE_W, PADDLE_H);

    // 球拖尾（渐隐彗尾）
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      const a = (i + 1) / trail.length;
      ctx.globalAlpha = a * 0.45;
      ctx.fillStyle = ballGlowColor;
      ctx.beginPath();
      ctx.arc(t.x, t.y, BALL_SIZE/2 * a * 0.85, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 触拍闪光环（向外扩散并淡出）
    if (flash > 0) {
      const rr = BALL_SIZE/2 + (1 - flash) * 46;
      ctx.globalAlpha = flash * 0.7;
      ctx.strokeStyle = flashColor;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(flashX, flashY, rr, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 球（带发光）
    const cx = ball.x + BALL_SIZE/2, cy = ball.y + BALL_SIZE/2;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, BALL_SIZE);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, '#f8fafc');
    grad.addColorStop(1, 'rgba(248,250,252,0)');
    ctx.save();
    ctx.shadowBlur = 22;
    ctx.shadowColor = ballGlowColor;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, BALL_SIZE/2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // 暂停遮罩
    if (paused) {
      ctx.fillStyle = 'rgba(11,14,19,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e6edf3';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⏸ 已暂停', W/2, H/2);
      ctx.textAlign = 'left';
    }

    // 发球倒计时 3-2-1
    if (serveCountdown > 0) {
      const n = Math.ceil(serveCountdown);
      ctx.fillStyle = 'rgba(11,14,19,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 96px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(n, W/2, H/2 + 32);
      ctx.font = '600 20px sans-serif';
      ctx.fillStyle = 'rgba(248,250,252,0.7)';
      ctx.fillText('准备发球…', W/2, H/2 - 60);
      ctx.textAlign = 'left';
    } else if (goTimer > 0) {
      // GO! 提示
      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 72px sans-serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, goTimer / 0.7);
      ctx.fillText('GO!', W/2, H/2 + 24);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }

    // 平分(DEUCE)提示：10 平后需连续领先 2 分
    if (left.score >= 10 && right.score >= 10) {
      const leadTxt = left.score > right.score ? '🟢 玩家1 领先' : (right.score > left.score ? '🔵 玩家2 领先' : '');
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('DEUCE 平分', W/2, 32);
      ctx.font = '600 16px sans-serif';
      ctx.fillStyle = 'rgba(251,191,36,0.85)';
      ctx.fillText(leadTxt ? (leadTxt + ' · 需再连得 1 分') : '需连续领先 2 分取胜', W/2, 58);
      ctx.textAlign = 'left';
    }

    // 本局结束过场提示
    if (setMsgTimer > 0) {
      ctx.fillStyle = 'rgba(11,14,19,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(setMsg, W/2, H/2);
      ctx.font = '600 20px sans-serif';
      ctx.fillStyle = 'rgba(248,250,252,0.7)';
      ctx.fillText('下一局即将开始…', W/2, H/2 + 44);
      ctx.textAlign = 'left';
    }
  }

  let lastTs = 0;
  function loop(ts) {
    if (!running) return;
    let dt = 0;
    if (lastTs) dt = Math.min(0.05, (ts - lastTs) / 1000); // 限制单帧步长，防卡顿跳变
    lastTs = ts;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === ' ' && running && !gameOver) togglePause();
  });
  document.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
    if (paused) Music.pause(); else Music.resume();
  }

  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', startGame);
  homeBtn.addEventListener('click', goHome);

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      modeBtns.forEach(b => b.classList.toggle('selected', b === btn));
    });
  });

  // 对战模式（双人 / 人机）选择
  const matchBtns = Array.from(document.querySelectorAll('.match-btn'));
  function updateP2Label() {
    if (!p2ctrlEl) return;
    p2ctrlEl.innerHTML = (matchMode === 'ai')
      ? `电脑 AI（右 · ${AI_LEVELS[aiDifficulty].name}）<br><b>自动</b> 防守 · 强力回球`
      : '玩家2（右）<br><b>↑/↓</b> 上下 · <b>←/→</b> 前后';
  }
  // 难度选择：仅人机模式显示
  const diffBtns = Array.from(document.querySelectorAll('.diff-btn'));
  const diffPickEl = document.getElementById('aiDiffPick');
  function updateDiffVisibility() {
    diffPickEl.classList.toggle('show', matchMode === 'ai');
  }
  diffBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      aiDifficulty = btn.dataset.diff;
      diffBtns.forEach(b => b.classList.toggle('selected', b === btn));
      updateP2Label();
    });
  });
  matchBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      matchMode = btn.dataset.match;
      matchBtns.forEach(b => b.classList.toggle('selected', b === btn));
      updateP2Label();
      updateDiffVisibility();
    });
  });
  updateP2Label();
  updateDiffVisibility();

  // 球拍类型选择：每个玩家可独立选强力拍或迅捷拍
  const paddleBtns = Array.from(document.querySelectorAll('.paddle-btn'));
  paddleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.pplayer, t = btn.dataset.ptype;
      if (p === 'left') left.type = t; else right.type = t;
      paddleBtns.forEach(b => {
        if (b.dataset.pplayer === p) b.classList.toggle('selected', b.dataset.ptype === t);
      });
    });
  });

  muteBtn.addEventListener('click', () => {
    const m = Music.toggleMute();
    muteBtn.textContent = m ? '🔇 静音' : '🔊 音乐';
  });

  // ===== 全屏 + 横屏锁定 =====
  const fsBtn = document.getElementById('fsBtn');
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } else {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }
  });

  // ===== 指针控制（鼠标 + 触摸统一，支持双指双人对战）=====
  const ptrMap = {}; // pointerId -> 'left' | 'right'
  function ptrPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  function sideOfPtr(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) < r.width / 2 ? 'left' : 'right';
  }
  function movePaddle(e) {
    if (!running || paused || gameOver) return;
    const side = ptrMap[e.pointerId];
    if (!side) return;
    if (side === 'right' && matchMode === 'ai') return; // 人机模式右侧由 AI 接管
    const p = ptrPos(e);
    const pd = (side === 'left') ? left : right;
    pd.y = p.y - PADDLE_H / 2 - 70; // 球拍在手指上方，避免遮挡
    pd.x = p.x - PADDLE_W / 2;
    pd.y = Math.max(0, Math.min(H - PADDLE_H, pd.y));
    if (side === 'left') pd.x = Math.max(LEFT_MIN_X, Math.min(LEFT_MAX_X, pd.x));
    else pd.x = Math.max(RIGHT_MIN_X, Math.min(RIGHT_MAX_X, pd.x));
  }
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!(e.pointerId in ptrMap)) ptrMap[e.pointerId] = sideOfPtr(e);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    movePaddle(e); // 按下立即把球拍拉到指下，反馈即时
  });
  canvas.addEventListener('pointermove', movePaddle);
  function releasePtr(e) { delete ptrMap[e.pointerId]; }
  canvas.addEventListener('pointerup', releasePtr);
  canvas.addEventListener('pointercancel', releasePtr);

  // ===== 画布自适应（移动端小屏自动缩放，桌面保持原尺寸）=====
  function fitCanvas() {
    const topbarH = document.querySelector('.topbar').offsetHeight || 0;
    const sbH = document.querySelector('.scoreboard').offsetHeight || 0;
    const miH = document.querySelector('.match-info').offsetHeight || 0;
    const availW = window.innerWidth - 20;
    const availH = window.innerHeight - topbarH - sbH - miH - 40;
    const s = Math.min(availW / W, availH / H, 1);
    if (s >= 1) { canvas.style.width = ''; canvas.style.height = ''; return; }
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));
  fitCanvas();

  // 初始绘制一帧静态画面
  draw();
})();
</script>
</body>
</html>
