      util.$$('.swatch').forEach(function (s) {
        s.classList.toggle('active', s.getAttribute('data-theme-set') === name);
      });
      setTimeout(redrawCharts, 60);
      return;
    }

    var btn = e.target.closest('[data-set]');
    if (btn) {
      var k = btn.getAttribute('data-set');
      var v = btn.getAttribute('data-val');
      if (k === 'fontSize') { S.fontSize = v; TM.store.saveSettings(); applyFontSize(v); }
      if (k === 'kbLayout') {
        S.kbLayout = v;
        TM.store.saveSettings();
        applyKbLayout(v);
        if (currentView === 'practice') buildKeyboard();
      }
      util.$$('.drawer .tb-btn[data-set="' + k + '"]').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-val') === v);
      });
      return;
    }

    var act = e.target.closest('[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      if (a === 'export') doExport();
      if (a === 'import') doImport();
      if (a === 'wipe') doWipe();
    }
  }

  function closeDrawer() {
    util.$('#drawerMask').hidden = true;
    util.$('#drawerSettings').hidden = true;
  }

  function doExport() {
    var data = TM.store.exportAll();
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'typing-master-backup-' + util.todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    util.toast(TM.i18n.t('toast.saved'), 'ok');
  }

  function doImport() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          TM.store.importAll(String(reader.result));
          S = TM.store.settings();
          applyTheme(S.theme);
          TM.i18n.set(S.lang);
          rebuildAll();
          util.toast(TM.i18n.t('toast.saved'), 'ok');
        } catch (err) {
          util.toast('Import failed', 'err');
        }
      };
      reader.readAsText(f);
    };
    input.click();
  }

  function doWipe() {
    if (!window.confirm(TM.i18n.t('stats.cleanConfirm'))) return;
    TM.store.wipe();
    S = TM.store.settings();
    applyTheme(S.theme);
    rebuildAll();
    util.toast(TM.i18n.t('toast.cleared'), 'ok');
  }

  /* ---------- 快捷键 ---------- */
  function globalKeys(e) {
    // Esc：优先关闭弹层
    if (e.key === 'Escape') {
      if (!util.$('#hotkeyMask').hidden) { closeHotkeys(); return; }
      if (!util.$('#drawerSettings').hidden) { closeDrawer(); return; }
    }

    // ⌘K 切换语言
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      toggleLang();
      return;
    }
    // ⌘J 切换主题
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') {
      e.preventDefault();
      cycleTheme();
      return;
    }
    // ? 打开快捷键
    if (e.key === '?' && !e.metaKey && !e.ctrlKey && currentView !== 'practice') {
      openHotkeys();
      return;
    }
  }

  function openHotkeys() {
    var modal = util.$('#hotkeyModal');
    modal.innerHTML = '';
    modal.appendChild(el('h2', {}, TM.i18n.t('about.hotkeys')));
    var table = el('table', { class: 'hk-table' });
    [
      ['Tab', TM.i18n.t('about.hk.tab')],
      ['Esc', TM.i18n.t('about.hk.esc')],
      ['Backspace', TM.i18n.t('about.hk.backspace')],
      ['⌘ / ⌥ + Backspace', TM.i18n.t('about.hk.ctrlBack')],
      ['⌘ + K', TM.i18n.t('about.hk.lang')],
      ['⌘ + J', TM.i18n.t('about.hk.theme')]
    ].forEach(function (r) {
      table.appendChild(el('tr', {}, [el('td', {}, el('kbd', {}, r[0])), el('td', {}, r[1])]));
    });
    modal.appendChild(table);
    modal.appendChild(el('div', { style: { marginTop: '20px' } },
      el('button', { class: 'btn', onclick: closeHotkeys }, TM.i18n.t('common.close'))));
    util.$('#hotkeyMask').hidden = false;
  }

  function closeHotkeys() { util.$('#hotkeyMask').hidden = true; }

  /* ---------- 音效 ---------- */
  var audioCtx = null;
  function beep(ok) {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = ok ? 620 : 220;
      g.gain.value = 0.02;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
      o.stop(audioCtx.currentTime + 0.052);
    } catch (e) {}
  }

  /* ---------- 焦点 / 失焦 ---------- */
  function setupFocus() {
    var flow = util.$('#textFlow');
    flow.addEventListener('click', function () { focusEngine(); });

    window.addEventListener('blur', function () {
      if (currentView === 'practice' && engine && !engine.isFinished()) {
        util.$('#caretHint').textContent = TM.i18n.t('practice.blur');
      }
    });

    window.addEventListener('focus', function () {
      if (currentView === 'practice' && engine && !engine.isFinished()) {
        util.$('#caretHint').textContent = TM.i18n.t('practice.tab');
      }
    });
  }

  /* =========================================================
     启动
     ========================================================= */
  function boot() {
    init();
    setupFocus();

    // 暴露给调试
    window.TM.app = {
      switchView: switchView,
      rebuild: rebuildAll,
      buildPractice: buildPractice,
      openGame: openGame,
      startLesson: startLesson
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
