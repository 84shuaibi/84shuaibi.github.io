  var t = function (k, v) { return TM.i18n.t(k, v); };

  /* ================= 共享：词库 ================= */

  function wordBank(langMode, level) {
    var lenMax = { easy: 4, normal: 6, hard: 9, insane: 99 }[level] || 6;

    if (langMode === 'zh') {
      // 中文：用常用词的拼音（去空格），逐键可打
      var pool = TM.data.zh.words
        .map(function (w) { return String(w.p).replace(/ /g, ''); })
        .filter(function (p) { return p.length >= 2 && p.length <= lenMax + 2; });
      // 再加上音节池
      var syl = TM.pinyin.ALL_SYLLABLES.filter(function (s) {
        return s.length <= lenMax;
      });
      return pool.concat(syl);
    }

    var src;
    if (level === 'easy') src = TM.data.en.top200.filter(function (w) { return w.length <= lenMax; });
    else if (level === 'normal') src = TM.data.en.common.filter(function (w) { return w.length <= lenMax; });
    else if (level === 'hard') src = TM.data.en.common.concat(TM.data.en.long);
    else src = TM.data.en.common.concat(TM.data.en.long);

    return src.length ? src : TM.data.en.top200;
  }

  function uniqueWords(bank, n) {
    var out = [];
    var tries = 0;
    while (out.length < n && tries < n * 30) {
      var w = util.pick(bank);
      if (out.indexOf(w) === -1 && w) out.push(w);
      tries++;
    }
    return out;
  }

  /* ================= 共享：框架 ================= */

  function css(name, fb) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return (v && v.trim()) || fb;
  }

  /**
   * 创建游戏壳
   */
  function makeShell(host, meta) {
    host.innerHTML = '';

    var head = el('div', { class: 'game-head' });
    var scores = el('div', { class: 'game-scores' });
    head.appendChild(scores);

    var right = el('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } });
    var levelSel = el('select', { class: 'tb-select' });
    [['easy', t('games.level.easy')], ['normal', t('games.level.normal')],
     ['hard', t('games.level.hard')], ['insane', t('games.level.insane')]].forEach(function (o) {
      levelSel.appendChild(el('option', { value: o[0] }, o[1]));
    });
    levelSel.value = meta.level || 'normal';
    right.appendChild(levelSel);

    var backBtn = el('button', { class: 'btn sm', 'data-act': 'back' }, t('common.back'));
    right.appendChild(backBtn);
    head.appendChild(right);

    var wrap = el('div', { class: 'game-canvas-wrap' });
    var canvas = el('canvas', { 'data-h': String(meta.height || 380) });
    wrap.appendChild(canvas);

    var overlay = el('div', { class: 'game-overlay' });
    wrap.appendChild(overlay);

    var inputBar = el('div', { class: 'game-input-bar' });
    var typedBox = el('span', { class: 'typed' });
    var caret = el('span', { class: 'caret' });
    var msg = el('span', { class: 'game-msg' });
    inputBar.appendChild(typedBox);
    inputBar.appendChild(caret);
    inputBar.appendChild(msg);

    host.appendChild(head);
    host.appendChild(wrap);
    host.appendChild(inputBar);

    return {
      head: head, scores: scores, wrap: wrap, canvas: canvas,
      overlay: overlay, typedBox: typedBox, msg: msg, levelSel: levelSel, backBtn: backBtn
    };
  }

  function scoreBox(k, v, ref) {
    var box = el('div', { class: 'sc' });
    box.appendChild(el('div', { class: 'v' }, String(v)));
    box.appendChild(el('div', { class: 'k' }, k));
    return box;
  }

  /* ================= 游戏 1：词汇雨 ================= */

  function rain(host, level, langMode, onExit) {
    var shell = makeShell(host, { level: level, height: 380 });
    var bank = wordBank(langMode, level);
    var speedBase = { easy: 16, normal: 26, hard: 40, insane: 58 }[level] || 26;

    var st = newState();
    function newState() {
      return {
        running: false, over: false, paused: false,
        drops: [], typed: '', lives: 3, score: 0, combo: 0, maxCombo: 0,
        cleared: 0, keystrokes: 0, okKeys: 0, startTime: 0, elapsed: 0,
        spawnTimer: 0, spawnGap: 1.7, lock: null, floats: []
      };
    }

    var ctx, W, H, dpr = window.devicePixelRatio || 1;

    function resize() {
      var r = shell.canvas.getBoundingClientRect();
      W = r.width || shell.wrap.clientWidth || 640;
      H = 380;
      shell.canvas.width = W * dpr;
      shell.canvas.height = H * dpr;
      shell.canvas.style.height = H + 'px';
      ctx = shell.canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawn() {
      var w = util.pick(bank);
      var fs = 17 + Math.min(w.length, 10);
      var x = 30 + Math.random() * Math.max(40, W - 200);
      st.drops.push({
        word: w, x: x, y: -24,
        vy: speedBase + Math.random() * 14 + st.cleared * 0.35,
        fs: fs, hue: Math.random()
      });
    }

    function updateStats() {
      shell.scores.innerHTML = '';
      shell.scores.appendChild(scoreBox(t('common.score'), st.score));
      shell.scores.appendChild(scoreBox(t('common.combo'), st.combo));
      shell.scores.appendChild(scoreBox(t('games.wordsCleared'), st.cleared));
      shell.scores.appendChild(scoreBox(t('games.lives'), '♥'.repeat(Math.max(0, st.lives))));
    }

    function setTyped() {
      shell.typedBox.innerHTML = '';
      var match = bestMatch();
      for (var i = 0; i < st.typed.length; i++) {
        var bad = match ? st.typed[i] !== match.word[i] : false;
        shell.typedBox.appendChild(el('span', { class: bad ? 'wrong' : '' }, st.typed[i]));
      }
    }

    function bestMatch() {
      // 找出以当前输入开头的、位置最低的单词
      var cand = st.drops.filter(function (d) {
        return d.word.indexOf(st.typed) === 0;
      });
      if (!cand.length) return null;
      cand.sort(function (a, b) { return b.y - a.y; });
      return cand[0];
    }

    function submit() {
      if (!st.typed) return;
      var idx = -1;
      for (var i = 0; i < st.drops.length; i++) {
        if (st.drops[i].word === st.typed) {
          if (idx === -1 || st.drops[i].y > st.drops[idx].y) idx = i;
        }
      }
      if (idx >= 0) {
        var d = st.drops[idx];
        st.drops.splice(idx, 1);
        st.combo++;
        st.maxCombo = Math.max(st.maxCombo, st.combo);
        var gain = 10 + d.word.length * 3 + st.combo * 2;
        st.score += gain;
        st.cleared++;
        st.floats.push({ x: d.x, y: d.y, text: '+' + gain, life: 0.9 });
      } else {
        st.combo = 0;
      }
      st.typed = '';
      setTyped();
      updateStats();
    }

    function onKey(e) {
      if (!st.running || st.over) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (e.key === 'Backspace') {
        e.preventDefault();
        st.typed = st.typed.slice(0, -1);
        setTyped();
        return;
      }
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        submit();
        return;
      }
      if (e.key.length === 1) {
        e.preventDefault();
        st.keystrokes++;
        st.typed += e.key;
        // 只保留能匹配的部分
        if (!bestMatch() && st.typed.length > 1) {
          st.typed = st.typed.slice(-1);
        }
        var m = bestMatch();
        if (m && st.typed === m.word) {
          submit();
        } else {
          setTyped();
        }
      }
    }

    function draw() {
      var bg = css('--bg-input', '#10131d');
      var accent = css('--accent', '#ffc94a');
      var text = css('--text', '#e7eaf2');
      var danger = css('--wrong', '#ff6b6b');
      var dim = css('--text-faint', '#4d566e');

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 危险线
      ctx.strokeStyle = util.hexA ? TM.stats.hexA(danger, 0.35) : danger;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, H - 34);
      ctx.lineTo(W, H - 34);
      ctx.stroke();
      ctx.setLineDash([]);

      // 下落词
      st.drops.forEach(function (d) {
        var near = 1 - util.clamp((H - 34 - d.y) / H, 0, 1);
        ctx.font = '600 ' + d.fs + 'px ui-monospace, monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = d.y > H - 150 ? danger : text;

        // 已输入前缀高亮
        if (st.typed && d.word.indexOf(st.typed) === 0) {
          var prefix = st.typed;
          var pw = ctx.measureText(prefix).width;
          ctx.fillStyle = accent;
          ctx.fillText(prefix, d.x, d.y);
          ctx.fillStyle = d.y > H - 150 ? danger : dim;
          ctx.fillText(d.word.slice(prefix.length), d.x + pw, d.y);
        } else {
          if (d.y > H - 150) ctx.fillStyle = danger;
          else ctx.fillStyle = dim;
          ctx.fillText(d.word, d.x, d.y);
        }
      });

      // 浮动分数
      st.floats.forEach(function (f) {
        ctx.globalAlpha = util.clamp(f.life, 0, 1);
        ctx.fillStyle = accent;
        ctx.font = '700 15px ui-monospace, monospace';
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
      });

      // 进度提示
      ctx.fillStyle = dim;
      ctx.font = '12px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(t('games.rain.howto'), 14, 20);
    }

    var last = 0, raf = null;

    function loop(ts) {
      if (!st.running) return;
      var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      if (!st.over && !st.paused) {
        st.elapsed += dt;

        st.spawnTimer += dt;
        var gap = Math.max(0.55, st.spawnGap - st.cleared * 0.02);
        if (st.spawnTimer > gap) {
          st.spawnTimer = 0;
          spawn();
        }

        for (var i = st.drops.length - 1; i >= 0; i--) {
          var d = st.drops[i];
          d.y += d.vy * dt;
          if (d.y > H - 34) {
            st.drops.splice(i, 1);
            st.lives--;
            st.combo = 0;
            updateStats();
            if (st.lives <= 0) { st.over = true; showOver(); }
          }
        }

        st.floats.forEach(function (f) { f.y -= 34 * dt; f.life -= dt; });
        st.floats = st.floats.filter(function (f) { return f.life > 0; });

        draw();
      }
      raf = requestAnimationFrame(loop);
    }

    function start() {
      st = newState();
      st.running = true;
      st.startTime = performance.now();
      resize();
      shell.overlay.hidden = true;
      updateStats();
      setTyped();
      last = 0;
      raf = requestAnimationFrame(loop);
      updateStats();
    }

    function showOver() {
      var wpm = st.elapsed > 1 ? Math.round((st.keystrokes / 5) / (st.elapsed / 60)) : 0;
      var isBest = TM.store.recordGame('rain:' + level + ':' + langMode, st.score);
      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.over')));
      if (isBest) box.appendChild(el('div', {
        style: { color: 'var(--accent)', fontWeight: '700', marginBottom: '10px' }
      }, '🎉 ' + t('games.newBest')));
      box.appendChild(el('div', {
        style: { display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: '10px 26px', margin: '0 0 22px', textAlign: 'left' }
      }, [
        kv(t('common.score'), st.score),
        kv(t('games.wordsCleared'), st.cleared),
        kv(t('games.maxCombo'), st.maxCombo),
        kv(t('games.wpm'), wpm)
      ]));
      box.appendChild(el('button', { class: 'btn primary', 'data-act': 'again' }, t('games.playAgain')));
      shell.overlay.appendChild(box);
    }

    function kv(k, v) {
      return el('div', {}, [
        el('div', { style: { fontSize: '22px', fontFamily: 'var(--font-mono)', fontWeight: '700', color: 'var(--accent)' } }, String(v)),
        el('div', { style: { fontSize: '11px', color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: '.6px' } }, k)
      ]);
    }

    function showIntro() {
      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.rain')));
      box.appendChild(el('p', {}, t('games.rain.howto')));
      box.appendChild(el('button', { class: 'btn primary', 'data-act': 'start' }, t('games.startGame')));
      shell.overlay.appendChild(box);
    }

    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', util.debounce(resize, 200));
    shell.overlay.addEventListener('click', function (e) {
      var act = e.target.closest('[data-act]');
      if (!act) return;
      var a = act.getAttribute('data-act');
      if (a === 'start' || a === 'again') start();
    });

    showIntro();
    resize();
    updateStats();

    return {
      destroy: function () {
        st.running = false;
        if (raf) cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      start: start
    };
  }

  /* ================= 游戏 2：竞速 ================= */

  function race(host, level, langMode, onExit) {
    var shell = makeShell(host, { level: level, height: 260 });
    var bank = wordBank(langMode, level);

    var cpuWpm = { easy: 28, normal: 45, hard: 65, insane: 90 }[level] || 45;

    var st;
    function reset() {
      st = {
        running: true, over: false,
        text: uniqueWords(bank, 22).join(' '),
        pos: 0, cpuPos: 0, keystrokes: 0, okKeys: 0,
        startTime: 0, elapsed: 0, done: false, won: false
      };
      shell.typedBox.innerHTML = '';
      shell.overlay.hidden = true;
    }

    var ctx, W, H, dpr = window.devicePixelRatio || 1;

    function resize() {
      var r = shell.canvas.getBoundingClientRect();
      W = r.width || shell.wrap.clientWidth || 640;
      H = 260;
      shell.canvas.width = W * dpr;
      shell.canvas.height = H * dpr;
      shell.canvas.style.height = H + 'px';
      ctx = shell.canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function updateScores() {
      shell.scores.innerHTML = '';
      shell.scores.appendChild(scoreBox(t('common.speed'), Math.round(st.elapsed > 0 ? (st.okKeys / 5) / (st.elapsed / 60) : 0) + ' WPM'));
      shell.scores.appendChild(scoreBox(t('common.accuracy'), (st.keystrokes ? Math.round(st.okKeys / st.keystrokes * 100) : 100) + '%'));
      shell.scores.appendChild(scoreBox(t('common.cpu'), cpuWpm + ' WPM'));
    }

    function onKey(e) {
      if (!st.running || st.over) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (st.pos > 0) st.pos--;
        renderText();
        return;
      }
      if (e.key.length !== 1) return;
      e.preventDefault();

      st.keystrokes++;
      var expect = st.text[st.pos];
      if (e.key === expect) {
        st.okKeys++;
        st.pos++;
      }
      renderText();
      if (st.pos >= st.text.length) finish(true);
    }

    function renderText() {
      // 文本以 canvas 绘制在下方；这里只更新输入条以外的统计
      updateScores();
    }

    function draw() {
      var bg = css('--bg-input', '#10131d');
      var accent = css('--accent', '#ffc94a');
      var text = css('--text', '#e7eaf2');
      var dim = css('--text-faint', '#4d566e');
      var wrong = css('--wrong', '#ff6b6b');

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      var laneY1 = H * 0.30;
      var laneY2 = H * 0.62;

      // 赛道
      ctx.strokeStyle = css('--border', '#262c3e');
      ctx.lineWidth = 2;
      [laneY1, laneY2].forEach(function (y) {
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(W - 30, y);
        ctx.stroke();
      });

      // 终点线
      ctx.strokeStyle = util.hexA ? TM.stats.hexA(accent, .6) : accent;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(W - 30, laneY1 - 22);
      ctx.lineTo(W - 30, laneY2 + 22);
      ctx.stroke();
      ctx.setLineDash([]);

      var prog = st.text.length ? st.pos / st.text.length : 0;
      var cpuProg = st.text.length ? st.cpuPos / st.text.length : 0;

      function car(x, y, color, label) {
        ctx.fillStyle = color;
        ctx.beginPath();
        var w = 34, h = 18;
        ctx.roundRect ? ctx.roundRect(x - w / 2, y - h / 2, w, h, 5) : ctx.rect(x - w / 2, y - h / 2, w, h);
        ctx.fill();
        ctx.fillStyle = bg;
        ctx.font = '700 10px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y + 3.5);
      }

      var x1 = 30 + prog * (W - 60);
      var x2 = 30 + cpuProg * (W - 60);
      car(x1, laneY1, accent, t('common.you'));
      car(x2, laneY2, wrong, 'CPU');

      // 文本
      ctx.font = '17px ui-monospace, monospace';
      ctx.textAlign = 'left';
      var marginX = 22;
      var maxW = W - marginX * 2;
      var line = '';
      var lines = [];
      for (var i = 0; i < st.text.length; i++) {
        var test = line + st.text[i];
        if (ctx.measureText(test).width > maxW) { lines.push(line); line = st.text[i]; }
        else line = test;
      }
      if (line) lines.push(line);

      var charCount = 0;
      var baseY = H - 26 - (lines.length - 1) * 24;
      lines.forEach(function (ln, li) {
        var x = marginX;
        var y = baseY + li * 24;
        for (var c = 0; c < ln.length; c++) {
          var idx = charCount + c;
          var ch = ln[c];
          if (idx < st.pos) ctx.fillStyle = accent;
          else if (idx === st.pos) ctx.fillStyle = text;
          else ctx.fillStyle = dim;
          ctx.fillText(ch, x, y);
          x += ctx.measureText(ch).width;
        }
        charCount += ln.length;
      });

      // 光标
      ctx.fillStyle = text;
      ctx.fillRect(marginX, baseY - 15, 0, 0);
    }

    var last = 0, raf = null;

    function loop(ts) {
      if (!st.running) return;
      var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      if (!st.over) {
        st.elapsed += dt;
        // CPU 推进（按字符计）
        var cpuCps = (cpuWpm * 5) / 60;
        st.cpuPos += cpuCps * dt;
        if (st.cpuPos >= st.text.length) { st.cpuPos = st.text.length; finish(false); }
        updateScores();
        draw();
      }
      raf = requestAnimationFrame(loop);
    }

    function finish(won) {
      if (st.over) return;
      st.over = true; st.done = true; st.won = won && st.pos >= st.text.length;

      var wpm = st.elapsed > 1 ? Math.round((st.okKeys / 5) / (st.elapsed / 60)) : 0;
      var acc = st.keystrokes ? Math.round(st.okKeys / st.keystrokes * 100) : 100;
      var score = st.won ? 1000 + Math.round(wpm * 10) : Math.round(st.pos * 6);

      var isBest = TM.store.recordGame('race:' + level + ':' + langMode, score);

      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, st.won ? '🏆 ' + (TM.i18n.get() === 'zh' ? '你赢了' : 'You win') : t('games.over')));
      if (isBest) box.appendChild(el('div', {
        style: { color: 'var(--accent)', fontWeight: '700', marginBottom: '10px' }
      }, '🎉 ' + t('games.newBest')));
      box.appendChild(el('div', {
        style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '12px 24px', marginBottom: '20px' }
      }, [
        kv(t('games.wpm'), wpm),
        kv(t('common.accuracy'), acc + '%'),
        kv(t('common.score'), score)
      ]));
      var btns = el('div', { style: { display: 'flex', gap: '10px', justifyContent: 'center' } });
      btns.appendChild(el('button', { class: 'btn primary', 'data-act': 'again' }, t('games.playAgain')));
      btns.appendChild(el('button', { class: 'btn', 'data-act': 'back' }, t('common.back')));
      box.appendChild(btns);
      shell.overlay.appendChild(box);
    }

    function kv(k, v) {
      return el('div', {}, [
        el('div', { style: { fontSize: '22px', fontFamily: 'var(--font-mono)', fontWeight: '700', color: 'var(--accent)' } }, String(v)),
        el('div', { style: { fontSize: '11px', color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: '.6px' } }, k)
      ]);
    }

    function start() {
      reset();
      resize();
      st.startTime = performance.now();
      last = 0;
      raf = requestAnimationFrame(loop);
      updateScores();
    }

    function intro() {
      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.race')));
      box.appendChild(el('p', {}, t('games.race.howto')));
      box.appendChild(el('button', { class: 'btn primary', 'data-act': 'start' }, t('games.startGame')));
      shell.overlay.appendChild(box);
    }

    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', util.debounce(resize, 200));
    shell.overlay.addEventListener('click', function (e) {
      var act = e.target.closest('[data-act]');
      if (!act) return;
      var a = act.getAttribute('data-act');
      if (a === 'start' || a === 'again') start();
      if (a === 'back') onExit && onExit();
    });

    reset();
    st.running = false;
    intro();
    resize();

    return {
      destroy: function () {
        st.running = false;
        if (raf) cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      start: start
    };
  }

  /* ================= 游戏 3：星际射击 ================= */

  function shooter(host, level, langMode, onExit) {
    var shell = makeShell(host, { level: level, height: 400 });
    var bank = wordBank(langMode, level);
    var speedBase = { easy: 14, normal: 22, hard: 32, insane: 46 }[level] || 22;

    var st = newState();
    function newState() {
      return {
        running: false, over: false,
        ships: [], typed: '', lives: 3, score: 0, combo: 0, maxCombo: 0,
        cleared: 0, keystrokes: 0, elapsed: 0,
        spawnTimer: 0, floats: [], particles: []
      };
    }

    var ctx, W, H, dpr = window.devicePixelRatio || 1;

    function resize() {
      var r = shell.canvas.getBoundingClientRect();
      W = r.width || shell.wrap.clientWidth || 640;
      H = 400;
      shell.canvas.width = W * dpr;
      shell.canvas.height = H * dpr;
      shell.canvas.style.height = H + 'px';
      ctx = shell.canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawn() {
      var w = util.pick(bank);
      st.ships.push({
        word: w,
        x: 60 + Math.random() * Math.max(60, W - 160),
        y: -10,
        vy: speedBase + Math.random() * 12 + st.cleared * 0.28,
        fs: 16,
        wob: Math.random() * Math.PI * 2
      });
    }

    function updateScores() {
      shell.scores.innerHTML = '';
      shell.scores.appendChild(scoreBox(t('common.score'), st.score));
      shell.scores.appendChild(scoreBox(t('common.combo'), st.combo));
      shell.scores.appendChild(scoreBox(t('games.wordsCleared'), st.cleared));
      shell.scores.appendChild(scoreBox(t('games.lives'), '♥'.repeat(Math.max(0, st.lives))));
    }

    function bestMatch() {
      var cand = st.ships.filter(function (s) { return s.word.indexOf(st.typed) === 0; });
      if (!cand.length) return null;
      cand.sort(function (a, b) { return b.y - a.y; });
      return cand[0];
    }

    function setTyped() {
      shell.typedBox.innerHTML = '';
      var m = bestMatch();
      for (var i = 0; i < st.typed.length; i++) {
        shell.typedBox.appendChild(el('span', {
          class: (m && st.typed[i] !== m.word[i]) ? 'wrong' : ''
        }, st.typed[i]));
      }
    }

    function submit() {
      if (!st.typed) return;
      var idx = -1;
      for (var i = 0; i < st.ships.length; i++) {
        if (st.ships[i].word === st.typed) {
          if (idx === -1 || st.ships[i].y > st.ships[idx].y) idx = i;
        }
      }
      if (idx >= 0) {
        var s = st.ships[idx];
        st.ships.splice(idx, 1);
        st.combo++;
        st.maxCombo = Math.max(st.maxCombo, st.combo);
        var gain = 15 + s.word.length * 4 + st.combo * 3;
        st.score += gain;
        st.cleared++;
        st.floats.push({ x: s.x, y: s.y, text: '+' + gain, life: 0.9 });
        // 爆炸粒子
        for (var p = 0; p < 12; p++) {
          st.particles.push({
            x: s.x, y: s.y,
            vx: (Math.random() - .5) * 180,
            vy: (Math.random() - .5) * 180,
            life: 0.5 + Math.random() * 0.4
          });
        }
      } else {
        st.combo = 0;
      }
      st.typed = '';
      setTyped();
      updateScores();
    }

    function onKey(e) {
      if (!st.running || st.over) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Backspace') {
        e.preventDefault();
        st.typed = st.typed.slice(0, -1);
        setTyped();
        return;
      }
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        submit();
        return;
      }
      if (e.key.length === 1) {
        e.preventDefault();
        st.keystrokes++;
        st.typed += e.key;
        var m = bestMatch();
        if (!m && st.typed.length > 1) st.typed = st.typed.slice(-1);
        m = bestMatch();
        if (m && st.typed === m.word) submit();
        else setTyped();
      }
    }

    function draw() {
      var bg = css('--bg-input', '#10131d');
      var accent = css('--accent', '#ffc94a');
      var text = css('--text', '#e7eaf2');
      var danger = css('--wrong', '#ff6b6b');
      var dim = css('--text-faint', '#4d566e');

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 星空
      ctx.fillStyle = util.hexA ? TM.stats.hexA(dim, .35) : dim;
      for (var i = 0; i < 40; i++) {
        var x = (i * 97 + (st.elapsed * 22) % 97 * 13) % W;
        var y = (i * 53 + st.elapsed * 30) % H;
        ctx.fillRect(x, y, 2, 2);
      }

      // 基地
      var baseY = H - 30;
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 34, baseY + 20);
      ctx.lineTo(W / 2, baseY - 6);
      ctx.lineTo(W / 2 + 34, baseY + 20);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = util.hexA ? TM.stats.hexA(danger, .3) : danger;
      ctx.setLineDash([5, 6]);
      ctx.beginPath();
      ctx.moveTo(0, baseY - 14);
      ctx.lineTo(W, baseY - 14);
      ctx.stroke();
      ctx.setLineDash([]);

      // 飞船
      st.ships.forEach(function (s) {
        var near = s.y > H - 160;
        ctx.font = '600 ' + s.fs + 'px ui-monospace, monospace';
        ctx.textAlign = 'left';
        var w = ctx.measureText(s.word).width;

        // 飞船体
        ctx.fillStyle = near ? danger : util.hexA ? TM.stats.hexA(accent, .22) : accent;
        ctx.beginPath();
        var bx = s.x - 8, by = s.y - 24, bw = w + 16, bh = 30;
        ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 8) : ctx.rect(bx, by, bw, bh);
        ctx.fill();

        // 词
        var prefix = (st.typed && s.word.indexOf(st.typed) === 0) ? st.typed : '';
        if (prefix) {
          var pw = ctx.measureText(prefix).width;
          ctx.fillStyle = accent;
          ctx.fillText(prefix, s.x, s.y - 4);
          ctx.fillStyle = near ? danger : text;
          ctx.fillText(s.word.slice(prefix.length), s.x + pw, s.y - 4);
        } else {
          ctx.fillStyle = near ? danger : text;
          ctx.fillText(s.word, s.x, s.y - 4);
        }
      });

      // 粒子
      st.particles.forEach(function (p) {
        ctx.globalAlpha = util.clamp(p.life * 2, 0, 1);
        ctx.fillStyle = accent;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      });

      // 浮动分
      st.floats.forEach(function (f) {
        ctx.globalAlpha = util.clamp(f.life, 0, 1);
        ctx.fillStyle = accent;
        ctx.font = '700 15px ui-monospace, monospace';
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
      });

      ctx.fillStyle = dim;
      ctx.font = '12px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(t('games.shooter.howto'), 14, 20);
    }

    var last = 0, raf = null;

    function loop(ts) {
      if (!st.running) return;
      var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      if (!st.over) {
        st.elapsed += dt;
        st.spawnTimer += dt;
        var gap = Math.max(0.6, 1.6 - st.cleared * 0.02);
        if (st.spawnTimer > gap) { st.spawnTimer = 0; spawn(); }

        for (var i = st.ships.length - 1; i >= 0; i--) {
          var s = st.ships[i];
          s.y += s.vy * dt;
          if (s.y > H - 44) {
            st.ships.splice(i, 1);
            st.lives--;
            st.combo = 0;
            updateScores();
            if (st.lives <= 0) { st.over = true; showOver(); }
          }
        }

        st.particles.forEach(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        });
        st.particles = st.particles.filter(function (p) { return p.life > 0; });

        st.floats.forEach(function (f) { f.y -= 30 * dt; f.life -= dt; });
        st.floats = st.floats.filter(function (f) { return f.life > 0; });

        draw();
      }
      raf = requestAnimationFrame(loop);
    }

    function start() {
      st = newState();
      st.running = true;
      resize();
      shell.overlay.hidden = true;
      updateScores();
      setTyped();
      last = 0;
      raf = requestAnimationFrame(loop);
    }

    function kv(k, v) {
      return el('div', {}, [
        el('div', { style: { fontSize: '22px', fontFamily: 'var(--font-mono)', fontWeight: '700', color: 'var(--accent)' } }, String(v)),
        el('div', { style: { fontSize: '11px', color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: '.6px' } }, k)
      ]);
    }

    function showOver() {
      var wpm = st.elapsed > 1 ? Math.round((st.keystrokes / 5) / (st.elapsed / 60)) : 0;
      var isBest = TM.store.recordGame('shooter:' + level + ':' + langMode, st.score);
      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.over')));
      if (isBest) box.appendChild(el('div', {
        style: { color: 'var(--accent)', fontWeight: '700', marginBottom: '10px' }
      }, '🎉 ' + t('games.newBest')));
      box.appendChild(el('div', {
        style: { display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: '10px 26px', marginBottom: '20px', textAlign: 'left' }
      }, [
        kv(t('common.score'), st.score),
        kv(t('games.wordsCleared'), st.cleared),
        kv(t('games.maxCombo'), st.maxCombo),
        kv(t('games.wpm'), wpm)
      ]));
      var btns = el('div', { style: { display: 'flex', gap: '10px', justifyContent: 'center' } });
      btns.appendChild(el('button', { class: 'btn primary', 'data-act': 'again' }, t('games.playAgain')));
      btns.appendChild(el('button', { class: 'btn', 'data-act': 'back' }, t('common.back')));
      box.appendChild(btns);
      shell.overlay.appendChild(box);
    }

    function intro() {
      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.shooter')));
      box.appendChild(el('p', {}, t('games.shooter.howto')));
      box.appendChild(el('button', { class: 'btn primary', 'data-act': 'start' }, t('games.startGame')));
      shell.overlay.appendChild(box);
    }

    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', util.debounce(resize, 200));
    shell.overlay.addEventListener('click', function (e) {
      var act = e.target.closest('[data-act]');
      if (!act) return;
      var a = act.getAttribute('data-act');
      if (a === 'start' || a === 'again') start();
      if (a === 'back') onExit && onExit();
    });

    intro();
    resize();
    updateScores();

    return {
      destroy: function () {
        st.running = false;
        if (raf) cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      start: start
    };
  }

  /* ================= 游戏 4：按键打地鼠 ================= */

  function mole(host, level, langMode, onExit) {
    var shell = makeShell(host, { level: level, height: 300 });
    var DURATION = 60;

    var LETTERS = langMode === 'zh'
      ? 'abcdefghijklmnopqrstuvwxyz'.split('')
      : 'abcdefghijklmnopqrstuvwxyz'.split('');

    var st = newState();
    function newState() {
      return {
        running: false, over: false, paused: false,
        keys: [], targetIdx: 0, hits: 0, misses: 0,
        score: 0, combo: 0, maxCombo: 0, timeLeft: DURATION,
        reactionStart: 0, reactions: []
      };
    }

    var ctx, W, H, dpr = window.devicePixelRatio || 1;

    function resize() {
      var r = shell.canvas.getBoundingClientRect();
      W = r.width || shell.wrap.clientWidth || 640;
      H = 300;
      shell.canvas.width = W * dpr;
      shell.canvas.height = H * dpr;
      shell.canvas.style.height = H + 'px';
      ctx = shell.canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function layout() {
      // 4 行 x 7 列
      var cols = 7, rows = 4;
      st.keys = [];
      var padX = Math.max(14, (W - cols * 74) / 2);
      var padY = 46;
      var cw = Math.min(74, (W - padX * 2) / cols);
      var chh = 48;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          st.keys.push({
            letter: LETTERS[(r * cols + c) % LETTERS.length],
            x: padX + c * cw, y: padY + r * chh,
            w: cw - 8, h: chh - 8, active: false, flash: 0
          });
        }
      }
      nextTarget();
    }

    function nextTarget() {
      if (!st.keys.length) return;
      var i = Math.floor(Math.random() * st.keys.length);
      st.keys.forEach(function (k) { k.active = false; });
      st.keys[i].active = true;
      st.targetIdx = i;
      st.reactionStart = performance.now();
    }

    function updateScores() {
      shell.scores.innerHTML = '';
      shell.scores.appendChild(scoreBox(t('common.time'), util.fmtTime(st.timeLeft)));
      shell.scores.appendChild(scoreBox(t('common.score'), st.score));
      shell.scores.appendChild(scoreBox(t('common.combo'), st.combo));
      shell.scores.appendChild(scoreBox(t('common.mistakes'), st.misses));
    }

    function onKey(e) {
      if (!st.running || st.over) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key.length !== 1) return;
      e.preventDefault();

      var target = st.keys[st.targetIdx];
      if (e.key.toLowerCase() === (target ? target.letter : '')) {
        var rt = performance.now() - st.reactionStart;
        st.reactions.push(rt);
        st.hits++;
        st.combo++;
        st.maxCombo = Math.max(st.maxCombo, st.combo);

        var speedBonus = util.clamp(Math.round((700 - rt) / 7), 0, 100);
        st.score += 10 + st.combo + speedBonus;
        target.flash = 1;
        nextTarget();
      } else {
        st.misses++;
        st.combo = 0;
        st.score = Math.max(0, st.score - 5);
      }
      updateScores();
    }

    function draw() {
      var bg = css('--bg-input', '#10131d');
      var accent = css('--accent', '#ffc94a');
      var text = css('--text', '#e7eaf2');
      var dim = css('--text-faint', '#4d566e');
      var danger = css('--wrong', '#ff6b6b');

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      st.keys.forEach(function (k) {
        ctx.fillStyle = k.active
          ? accent
          : (k.flash > 0 ? util.hexA ? TM.stats.hexA(accent, k.flash * .5) : accent : css('--bg-elev', '#1b1f2e'));
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(k.x, k.y, k.w, k.h, 8);
        else ctx.rect(k.x, k.y, k.w, k.h);
        ctx.fill();

        ctx.fillStyle = k.active ? bg : dim;
        ctx.font = '600 17px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(k.letter.toUpperCase(), k.x + k.w / 2, k.y + k.h / 2);
        ctx.textBaseline = 'alphabetic';
      });

      // 顶部信息
      ctx.fillStyle = dim;
      ctx.font = '12px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(t('games.mole.howto'), 14, 22);

      var avgRt = st.reactions.length
        ? Math.round(st.reactions.reduce(function (a, b) { return a + b; }, 0) / st.reactions.length)
        : 0;
      ctx.textAlign = 'right';
      ctx.fillStyle = accent;
      ctx.font = '600 13px ui-monospace, monospace';
      ctx.fillText(avgRt ? avgRt + 'ms' : '', W - 14, 22);
    }

    var last = 0, raf = null;

    function loop(ts) {
      if (!st.running) return;
      var dt = last ? Math.min((ts - last) / 1000, 0.1) : 0;
      last = ts;

      if (!st.over) {
        st.timeLeft -= dt;
        st.keys.forEach(function (k) { if (k.flash > 0) k.flash -= dt * 4; });

        // 超时未按也算失误
        if (st.reactionStart && performance.now() - st.reactionStart > 2600) {
          st.misses++;
          st.combo = 0;
          updateScores();
          nextTarget();
        }

        if (st.timeLeft <= 0) { st.timeLeft = 0; st.over = true; showOver(); }
        updateScores();
        draw();
      }
      raf = requestAnimationFrame(loop);
    }

    function start() {
      st = newState();
      st.running = true;
      resize();
      layout();
      shell.overlay.hidden = true;
      last = 0;
      updateScores();
      raf = requestAnimationFrame(loop);
    }

    function kv(k, v) {
      return el('div', {}, [
        el('div', { style: { fontSize: '22px', fontFamily: 'var(--font-mono)', fontWeight: '700', color: 'var(--accent)' } }, String(v)),
        el('div', { style: { fontSize: '11px', color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: '.6px' } }, k)
      ]);
    }

    function showOver() {
      var avgRt = st.reactions.length
        ? Math.round(st.reactions.reduce(function (a, b) { return a + b; }, 0) / st.reactions.length)
        : 0;
      var acc = (st.hits + st.misses) ? Math.round(st.hits / (st.hits + st.misses) * 100) : 100;
      var isBest = TM.store.recordGame('mole:' + level + ':' + langMode, st.score);

      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.over')));
      if (isBest) box.appendChild(el('div', {
        style: { color: 'var(--accent)', fontWeight: '700', marginBottom: '10px' }
      }, '🎉 ' + t('games.newBest')));
      box.appendChild(el('div', {
        style: { display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: '10px 26px', marginBottom: '20px', textAlign: 'left' }
      }, [
        kv(t('common.score'), st.score),
        kv(t('games.maxCombo'), st.maxCombo),
        kv(t('common.accuracy'), acc + '%'),
        kv('Avg', avgRt + 'ms')
      ]));
      var btns = el('div', { style: { display: 'flex', gap: '10px', justifyContent: 'center' } });
      btns.appendChild(el('button', { class: 'btn primary', 'data-act': 'again' }, t('games.playAgain')));
      btns.appendChild(el('button', { class: 'btn', 'data-act': 'back' }, t('common.back')));
      box.appendChild(btns);
      shell.overlay.appendChild(box);
    }

    function intro() {
      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.mole')));
      box.appendChild(el('p', {}, t('games.mole.howto')));
      box.appendChild(el('button', { class: 'btn primary', 'data-act': 'start' }, t('games.startGame')));
      shell.overlay.appendChild(box);
    }

    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', util.debounce(function () { resize(); layout(); }, 200));
    shell.overlay.addEventListener('click', function (e) {
      var act = e.target.closest('[data-act]');
      if (!act) return;
      var a = act.getAttribute('data-act');
      if (a === 'start' || a === 'again') start();
      if (a === 'back') onExit && onExit();
    });

    intro();
    resize();
    layout();
    updateScores();

    return {
      destroy: function () {
        st.running = false;
        if (raf) cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      start: start
    };
  }

  /* ================= 游戏 5：节奏打字 ================= */

  function rhythm(host, level, langMode, onExit) {
    var shell = makeShell(host, { level: level, height: 320 });
    var bank = wordBank(langMode, 'easy');

    var bpm = { easy: 55, normal: 75, hard: 95, insane: 120 }[level] || 75;
    var beatMs = 60000 / bpm;

    var st = newState();
    function newState() {
      return {
        running: false, over: false,
        current: '', typed: '', score: 0, combo: 0, maxCombo: 0,
        perfect: 0, good: 0, miss: 0, elapsed: 0,
        beatStart: 0, hitWindow: false, floats: [], lastBeat: -1,
        keystrokes: 0, okKeys: 0
      };
    }

    var ctx, W, H, dpr = window.devicePixelRatio || 1;

    function resize() {
      var r = shell.canvas.getBoundingClientRect();
      W = r.width || shell.wrap.clientWidth || 640;
      H = 320;
      shell.canvas.width = W * dpr;
      shell.canvas.height = H * dpr;
      shell.canvas.style.height = H + 'px';
      ctx = shell.canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function nextWord() {
      var w = util.pick(bank);
      st.current = w;
      st.typed = '';
      st.beatStart = performance.now();
      st.wordsDone = (st.wordsDone || 0) + 1;
      setTyped();
    }

    function updateScores() {
      shell.scores.innerHTML = '';
      shell.scores.appendChild(scoreBox(t('common.score'), st.score));
      shell.scores.appendChild(scoreBox(t('common.combo'), st.combo));
      shell.scores.appendChild(scoreBox('PERFECT', st.perfect));
      shell.scores.appendChild(scoreBox('MISS', st.miss));
    }

    function setTyped() {
      shell.typedBox.innerHTML = '';
      for (var i = 0; i < st.typed.length; i++) {
        st.typedBox.appendChild(el('span', {
          class: st.typed[i] !== st.current[i] ? 'wrong' : ''
        }, st.typed[i]));
      }
    }

    /** 判定时机：距离节拍点越近越好 */
    function judge() {
      var dt = performance.now() - st.beatStart;
      var phase = dt % beatMs;
      var dist = Math.min(phase, beatMs - phase);   // 距最近节拍点的毫秒数
      var ratio = dist / (beatMs / 2);              // 0 = 正中，1 = 最远

      if (ratio < 0.18) { st.perfect++; st.score += 120 + st.combo * 4; return { grade: 'PERFECT', color: css('--accent', '#ffc94a'), ratio: 0 }; }
      if (ratio < 0.45) { st.good++; st.score += 60 + st.combo * 2; return { grade: 'GOOD', color: css('--correct', '#7ee787'), ratio: 0 }; }
      st.miss++; st.combo = 0;
      return { grade: 'MISS', color: css('--wrong', '#ff6b6b'), ratio: 1 };
    }

    function onKey(e) {
      if (!st.running || st.over) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Backspace') {
        e.preventDefault();
        st.typed = st.typed.slice(0, -1);
        setTyped();
        return;
      }
      if (e.key.length !== 1) return;
      e.preventDefault();
      st.keystrokes++;

      var expect = st.current[st.typed.length];
      if (e.key !== expect) {
        st.miss++;
        st.combo = 0;
        updateScores();
        return;
      }

      st.okKeys++;
      st.typed += e.key;
      setTyped();

      // 单词打完 → 判定
      if (st.typed.length === st.current.length) {
        var r = judge();
        if (r.grade !== 'MISS') {
          st.combo++;
          st.maxCombo = Math.max(st.maxCombo, st.combo);
        }
        st.floats.push({ text: r.grade, color: r.color, life: 0.8, y: 0 });
        updateScores();
        nextWord();
      }
    }

    function draw() {
      var bg = css('--bg-input', '#10131d');
      var accent = css('--accent', '#ffc94a');
      var text = css('--text', '#e7eaf2');
      var dim = css('--text-faint', '#4d566e');

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      var cx = W / 2, cy = H * 0.45;
      var R = 74;

      // 节拍环
      var dt = performance.now() - st.beatStart;
      var phase = (dt % beatMs) / beatMs;       // 0→1
      var ringR = R * (1.9 - phase * 1.05);
      var closeness = 1 - Math.min(phase, 1 - phase) * 2;   // 1 = 恰好踩点

      ctx.strokeStyle = css('--border', '#262c3e');
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = accent;
      ctx.lineWidth = 3 + closeness * 3;
      ctx.globalAlpha = 0.25 + closeness * 0.75;
      ctx.beginPath();
      ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // 当前词
      ctx.fillStyle = text;
      ctx.font = '700 34px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(st.current, cx, cy);

      // 已输入
      if (st.typed) {
        var full = ctx.measureText(st.current).width;
        var pre = ctx.measureText(st.typed).width;
        ctx.fillStyle = accent;
        ctx.fillText(st.typed, cx - full / 2 + pre / 2, cy);
        ctx.textAlign = 'left';
        ctx.fillText(st.typed, cx - full / 2, cy);
      }
      ctx.textBaseline = 'alphabetic';

      // 浮动判定
      st.floats.forEach(function (f) {
        ctx.globalAlpha = util.clamp(f.life, 0, 1);
        ctx.fillStyle = f.color;
        ctx.font = '700 22px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(f.text, cx, cy - 60 - (0.8 - f.life) * 40);
        ctx.globalAlpha = 1;
      });

      ctx.fillStyle = dim;
      ctx.font = '12px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(t('games.rhythm.howto') + '   ·   ' + bpm + ' BPM', 14, 22);
    }

    var last = 0, raf = null;

    function loop(ts) {
      if (!st.running) return;
      var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      if (!st.over) {
        st.elapsed += dt;
        st.floats.forEach(function (f) { f.life -= dt; });
        st.floats = st.floats.filter(function (f) { return f.life > 0; });

        // 40 秒或 30 个词后收关
        if (st.elapsed >= 40 || (st.wordsDone || 0) > 30) {
          st.over = true;
          showOver();
        }
        draw();
      }
      raf = requestAnimationFrame(loop);
    }

    function start() {
      st = newState();
      st.running = true;
      resize();
      shell.overlay.hidden = true;
      nextWord();
      updateScores();
      last = 0;
      raf = requestAnimationFrame(loop);
    }

    function kv(k, v) {
      return el('div', {}, [
        el('div', { style: { fontSize: '22px', fontFamily: 'var(--font-mono)', fontWeight: '700', color: 'var(--accent)' } }, String(v)),
        el('div', { style: { fontSize: '11px', color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: '.6px' } }, k)
      ]);
    }

    function showOver() {
      var isBest = TM.store.recordGame('rhythm:' + level + ':' + langMode, st.score);
      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.over')));
      if (isBest) box.appendChild(el('div', {
        style: { color: 'var(--accent)', fontWeight: '700', marginBottom: '10px' }
      }, '🎉 ' + t('games.newBest')));
      box.appendChild(el('div', {
        style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '10px 26px', marginBottom: '20px' }
      }, [
        kv(t('common.score'), st.score),
        kv('PERFECT', st.perfect),
        kv(t('games.maxCombo'), st.maxCombo)
      ]));
      var btns = el('div', { style: { display: 'flex', gap: '10px', justifyContent: 'center' } });
      btns.appendChild(el('button', { class: 'btn primary', 'data-act': 'again' }, t('games.playAgain')));
      btns.appendChild(el('button', { class: 'btn', 'data-act': 'back' }, t('common.back')));
      box.appendChild(btns);
      shell.overlay.appendChild(box);
    }

    function intro() {
      shell.overlay.hidden = false;
      shell.overlay.innerHTML = '';
      var box = el('div');
      box.appendChild(el('h2', {}, t('games.rhythm')));
      box.appendChild(el('p', {}, t('games.rhythm.howto')));
      box.appendChild(el('button', { class: 'btn primary', 'data-act': 'start' }, t('games.startGame')));
      shell.overlay.appendChild(box);
    }

    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', util.debounce(resize, 200));
    shell.overlay.addEventListener('click', function (e) {
      var act = e.target.closest('[data-act]');
      if (!act) return;
      var a = act.getAttribute('data-act');
      if (a === 'start' || a === 'again') start();
      if (a === 'back') onExit && onExit();
    });

    st.current = util.pick(bank);
    intro();
    resize();
    updateScores();

    return {
      destroy: function () {
        st.running = false;
        if (raf) cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      start: start
    };
  }

  /* ================= 出口 ================= */

  var IMPL = { rain: rain, race: race, shooter: shooter, mole: mole, rhythm: rhythm };

  function start(id, host, opts) {
    opts = opts || {};
    var fn = IMPL[id];
    if (!fn) return null;
    var inst = fn(host, opts.level || 'normal', opts.langMode || 'en', opts.onExit);
    inst.id = id;
    return inst;
  }

  return { start: start, IMPL: IMPL, wordBank: wordBank };
})();

</script>
<!-- ===== js/app.js ===== -->
<script>
/* =========================================================
   app.js — 主控 / 路由 / 练习编排
   TM.app
   ========================================================= */
(function () {
  'use strict';

  var util = TM.util;
  var el = util.el;

  var S = null;                    // settings 引用
  var engine = null;               // 当前引擎实例
  var currentRun = null;           // 当前练习上下文
  var timerId = null;
  var gameInst = null;
  var currentView = 'practice';
  var kbEl = null;

  /* =========================================================
     初始化
     ========================================================= */
  function init() {
    S = TM.store.settings();

    applyTheme(S.theme);
    applyKbLayout(S.kbLayout);
    TM.i18n.set(S.lang);
    bindChrome();

    switchView('practice');
    buildPractice();

    document.addEventListener('keydown', globalKeys);

    // 系统偏好
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setTimeout(function () { util.toast(TM.i18n.t('toast.reducedMotion')); }, 1200);
    }
  }

  function applyTheme(name) {
    document.documentElement.setAttribute('data-theme', name || 'dark');
  }

  /** 键盘布局：'' = 自动按系统识别 */
  function applyKbLayout(v) {
    var want = (v === 'mac' || v === 'win') ? v : TM.keyboard.detectLayout();
    TM.keyboard.setLayout(want);
  }

  function applyFontSize(size) {
    var flow = util.$('#textFlow');
    if (!flow) return;
    flow.classList.remove('size-s', 'size-l');
    if (size === 's') flow.classList.add('size-s');
    if (size === 'l') flow.classList.add('size-l');
  }

  /* =========================================================
     顶栏绑定
     ========================================================= */
  function bindChrome() {
    document.addEventListener('click', function (e) {
      var navBtn = e.target.closest('[data-nav]');
      if (navBtn) {
        switchView(navBtn.getAttribute('data-nav'));
        return;
      }

      var langBtn = e.target.closest('.lang-opt');
      if (langBtn) {
        setLang(langBtn.getAttribute('data-lang'));
        return;
      }

      if (e.target.closest('#btnTheme')) {
        cycleTheme();
        return;
      }

      if (e.target.closest('#btnSettings')) {
        openDrawer();
        return;
      }

      if (e.target.closest('#btnLang')) {
        toggleLang();
        return;
      }
    });

    util.$('#drawerMask').addEventListener('click', closeDrawer);

    util.$('#hotkeyMask').addEventListener('click', function (e) {
      if (e.target === this) closeHotkeys();
    });
  }

  function setLang(lang) {
    S.lang = (lang === 'en') ? 'en' : 'zh';
    TM.store.saveSettings();
    TM.i18n.set(S.lang);
    util.toast(TM.i18n.t('toast.langChanged'));

    // 中文界面默认把练习内容也切到中文，反之亦然
    if (S.langMode !== S.lang) {
      S.langMode = S.lang;
      TM.store.saveSettings();
    }

    rebuildAll();
  }

  function toggleLang() { setLang(TM.i18n.get() === 'zh' ? 'en' : 'zh'); }

  var THEMES = ['dark', 'ocean', 'forest', 'violet', 'light'];
  function cycleTheme() {
    var i = THEMES.indexOf(S.theme);
    var next = THEMES[(i + 1) % THEMES.length];
    S.theme = next;
    TM.store.saveSettings();
    applyTheme(next);
    util.toast(TM.i18n.t('toast.themeChanged') + ': ' + next);
    if (TM.i18n.get() === 'zh') setTimeout(redrawCharts, 60);
  }

  function redrawCharts() {
    // 主题切换后重绘图表
    if (currentRun && currentRun.summary) {
      var cvs = document.querySelectorAll('.result canvas');
      if (cvs.length) {
        TM.stats.drawSpeedChart(cvs[0], currentRun.summary.curve);
        if (cvs[1]) TM.stats.drawErrorChart(cvs[1], currentRun.summary.errPoints, currentRun.summary.elapsed);
      }
    }
    if (currentView === 'stats') renderView('stats');
  }

  /* =========================================================
     路由
     ========================================================= */
  function switchView(name) {
    currentView = name;

    util.$$('.view').forEach(function (v) { v.hidden = true; });
    var target = util.$('#view-' + name);
    if (target) target.hidden = false;

    util.$$('.nav-item').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-nav') === name);
    });

    if (name !== 'practice' && engine) {
      // 离开练习页时停掉计时器
      stopTimer();
    }

    if (name === 'lessons') {
      renderView('lessons');
    } else if (name === 'games') {
      destroyGame();
      renderView('games');
    } else if (name === 'stats') {
      renderView('stats');
    } else if (name === 'about') {
      renderView('about');
    } else if (name === 'practice') {
      destroyGame();
      buildPractice();
      focusEngine();
    }
  }

  function renderView(name) {
    var host = util.$('#view-' + name);
    if (!host) return;
    host.innerHTML = '';

    if (name === 'lessons') {
      host.appendChild(TM.views.renderLessons());
      bindLessonCards(host);
    } else if (name === 'stats') {
      host.appendChild(TM.views.renderStats());
    } else if (name === 'about') {
      host.appendChild(TM.views.renderAbout());
    } else if (name === 'games') {
      host.appendChild(TM.views.renderGamesHub());
      bindGameCards(host);
    }
  }

  function rebuildAll() {
    TM.i18n.apply(document);
    if (currentView === 'practice') {
      buildPractice();
    } else {
      renderView(currentView);
    }
    if (!util.$('#drawerSettings').hidden) openDrawer();
  }

  /* =========================================================
     练习页
     ========================================================= */
  function buildPractice() {
    var toolbarHost = util.$('#practiceToolbar');
    toolbarHost.innerHTML = '';
    toolbarHost.appendChild(TM.views.renderToolbar());
    bindToolbar(toolbarHost);

    // 自定义文本面板
    renderCustomPanel();

    var flowHost = util.$('#textFlow');
    var resultHost = util.$('#result');

    // 键盘
    buildKeyboard();

    // 生成内容
    var content = buildContent();

    // 销毁旧引擎
    if (engine) engine.destroy();

    engine = TM.engine.create({
      container: flowHost,
      target: content.target,
      align: content.align,
      hanChars: content.hanChars,
      groups: content.groups,
      ime: content.ime,
      allowBackspace: S.backspace,
      stopOnError: S.stopOnError,
      strictSpace: S.strictSpace,
      showPinyin: S.showPinyin,
      autoNext: false,
      onUpdate: onEngineUpdate,
      onChar: onEngineChar,
      onWord: onEngineWord,
      onCursor: onEngineCursor,
      onFinish: onEngineFinish,
      onStart: onEngineStart,
      onRestart: onEngineRestart
    });

    engine.mount();

    currentRun = {
      content: content,
      label: content.label,
      started: false,
      finished: false,
      timer: null,
      timeLimit: (S.mode === 'time' && S.langMode === 'en') ? S.timeLimit : null,
      summary: null
    };

    resultHost.hidden = true;
    resultHost.innerHTML = '';

    applyFontSize(S.fontSize);
    updateLiveStats({ elapsed: 0, progress: 0, wpm: 0, rawWpm: 0, cpm: 0, accuracy: 100, correct: 0, wrong: 0, cursor: 0, total: content.target.length });

    util.$('#caretHint').textContent = content.hint || TM.i18n.t('common.ready');
    util.$('#imeEcho').hidden = true;

    // 隐藏 IME 回显框（不使用）
    updateKeyboardHints();

    focusEngine();
  }

  function focusEngine() {
    if (!engine) return;
    setTimeout(function () { engine.focus(); }, 30);
  }

  /* ---------- 自定义文本面板 ---------- */
  function renderCustomPanel() {
    var host = util.$('#stage');
    var old = util.$('#customPanel');
    if (old && old.parentNode) old.parentNode.removeChild(old);

    if (S.mode !== 'custom') return;

    var panel = el('div', { class: 'panel', id: 'customPanel', style: { marginBottom: '18px' } });
    panel.appendChild(el('div', {
      style: { fontSize: '13px', color: 'var(--text-dim)', marginBottom: '10px' }
    }, TM.i18n.t('practice.custom.hint')));

    var ta = el('textarea', {
      class: 'tb-input',
      id: 'customTextArea',
      rows: '4',
      style: { width: '100%', minHeight: '92px', resize: 'vertical', lineHeight: '1.6', fontFamily: 'var(--font-mono)', fontSize: '13px' },
      placeholder: TM.i18n.t('practice.custom.placeholder')
    });
    ta.value = getCustomText();
    panel.appendChild(ta);

    var bar = el('div', { style: { display: 'flex', gap: '10px', marginTop: '12px', alignItems: 'center' } });
    var goBtn = el('button', { class: 'btn primary sm' }, TM.i18n.t('practice.custom.go'));
    var clearBtn = el('button', { class: 'btn sm' }, TM.i18n.t('common.clear'));

    goBtn.addEventListener('click', function () {
      var v = ta.value.trim();
      if (v.length < 12) { util.toast(TM.i18n.t('toast.textTooShort'), 'err'); return; }
      setCustomText(v);
      buildPractice();
    });
    clearBtn.addEventListener('click', function () {
      ta.value = '';
      setCustomText('');
    });

    bar.appendChild(goBtn);
    bar.appendChild(clearBtn);
    bar.appendChild(el('span', {
      style: { marginLeft: 'auto', fontSize: '12px', color: 'var(--text-faint)', fontFamily: 'var(--font-mono)' }
    }, ta.value.length + ' chars'));
    ta.addEventListener('input', function () {
      var c = bar.lastChild;
      if (c) c.textContent = ta.value.length + ' chars';
    });

    panel.appendChild(bar);
    host.parentNode.insertBefore(panel, host);
    setTimeout(function () { ta.focus(); }, 30);
  }

  /* ---------- 内容生成 ---------- */
  function buildContent() {
    var langMode = S.langMode;
    var mode = S.mode;

    // 代码模式
    if ((S.contentType || 'text') === 'code') {
      var snips = TM.data.code.snippets[S.codeLang] || TM.data.code.snippets.javascript;
      var text = util.shuffle(snips).slice(0, mode === 'words' ? 3 : 5).join('\n\n');
      return plainContent(text, 'code · ' + (TM.data.code.langNames[S.codeLang] || ''));
    }

    if (langMode === 'zh') return buildZhContent(mode);
    return buildEnContent(mode);
  }

  /* ---------- 英文内容 ---------- */
  function buildEnContent(mode) {
    var bank;
    var addPunct = S.punctuation;
    var addNum = S.numbers;

    if (mode === 'quote') {
      if (S.quoteSource === 'prose') {
        var pi = Math.floor(Math.random() * TM.data.en.prose.length);
        return plainContent(TM.data.en.prose[pi], 'prose');
      }
      if (S.quoteSource === 'long') {
        return plainContent(util.shuffle(TM.data.en.long).slice(0, 14).join(' '), 'long words');
      }
      var q = util.pick(TM.data.en.quotes);
      return plainContent(q.t + ' — ' + q.a, q.a);
    }

    if (mode === 'adaptive') {
      var g = TM.adaptive.generateEn(mode === 'words' ? S.wordCount : 26);
      return plainContent(g.text, 'adaptive · ' + (g.focus.join(' ') || '—'));
    }

    if (mode === 'custom') {
      var custom = getCustomText();
      if (!custom || custom.length < 8) {
        return plainContent(TM.data.en.common.slice(0, 22).join(' '), 'custom');
      }
      return plainContent(custom, 'custom');
    }

    if (mode === 'zen') {
      bank = TM.data.en.common;
      return plainContent(makeWords(bank, 90, false, false).join(' '), 'zen');
    }

    // time / words
    bank = pickEnBank();
    // 限时模式按时间估算词量，保证打不完（宁可多给）
    var count = mode === 'words'
      ? S.wordCount
      : Math.max(40, Math.round(S.timeLimit * 2.2));
    var words = makeWords(bank, count, addPunct, addNum);

    if (addPunct) {
      // 首字母大写化，看起来更像句子
      words = words.map(function (w, i) {
        if (i % 9 === 0) return w.charAt(0).toUpperCase() + w.slice(1);
        return w;
      });
    }

    var label = mode === 'time' ? (S.timeLimit + 's') : (S.wordCount + ' words');
    return plainContent(words.join(' '), label);
  }

  function pickEnBank() {
    var lvl = S.langMode;
    var base = TM.data.en.common;
    if (S.punctuation && S.numbers) return base.concat(TM.data.en.numberWords);
    return base;
  }

  function makeWords(bank, count, addPunct, addNum) {
    var out = [];
    var puncts = [',', '.', ';', '!', '?', ':', ','];
    for (var i = 0; i < count; i++) {
      var w = util.pick(bank);
      if (addNum && i % 7 === 3) w = String(util.randInt(10, 9999));
      if (addPunct && i % 6 === 5) w = w + util.pick(puncts);
      out.push(w);
    }
    return out;   // 返回数组，由调用方决定怎么拼
  }

  /* ---------- 中文内容 ---------- */
  function buildZhContent(mode) {
    var isEncode = S.zhInput !== 'ime';

    /* 1) 诗词 / 文章模式 */
    if (mode === 'quote') {
      if (S.quoteSource === 'poem') {
        var poem = util.pick(TM.data.zh.poems);
        return zhItem(poem, poem.title + ' · ' + poem.author, isEncode);
      }
      if (S.quoteSource === 'prose') {
        var pr = util.pick(TM.data.zh.prose);
        return zhItem(pr, 'prose', isEncode);
      }
      if (S.quoteSource === 'idiom') {
        var ids = util.shuffle(TM.data.zh.idioms).slice(0, 10);
        return zhItems(ids, '成语', isEncode);
      }
      var ws = util.shuffle(TM.data.zh.words).slice(0, 14);
      return zhItems(ws, '词组', isEncode);
    }

    /* 2) 自适应 */
    if (mode === 'adaptive') {
      var gen = TM.adaptive.generateZhSyllables(mode === 'words' ? S.wordCount : 22);
      // 纯音节练习：目标就是拼音字母
      return {
        target: (gen.p + ' ' + gen.p).split(''),
        align: null,
        hanChars: null,
        groups: null,
        ime: false,
        label: 'adaptive · ' + (gen.focus.slice(0, 4).join(' ') || '拼音'),
        hint: TM.i18n.get() === 'zh' ? '按拼音直接敲字母' : 'Type the pinyin letters'
      };
    }

    /* 3) 自定义 */
    if (mode === 'custom') {
      var custom = getCustomText();
      if (!custom || custom.length < 4) {
        return zhItems(util.shuffle(TM.data.zh.words).slice(0, 12), '词语', isEncode);
      }
      // 自定义中文：直接当汉字打（IME）
      return plainContent(custom, 'custom');
    }

    /* 4) 禅模式 */
    if (mode === 'zen') {
      var zenWords = util.shuffle(TM.data.zh.phrases).slice(0, 18);
      return zhItems(zenWords, 'zen', isEncode);
    }

    /* 5) 限时 / 词数 */
    var pool = TM.data.zh.words.concat(TM.data.zh.phrases.map(function (p) {
      return { t: p.t, p: p.p };
    }));

    var count = mode === 'words'
      ? Math.max(6, Math.round(S.wordCount / 2))
      : (mode === 'time' ? Math.max(20, Math.round(S.timeLimit * 0.7)) : 22);
    var picked = util.shuffle(pool).slice(0, count);
    return zhItems(picked, mode === 'time' ? '中文 · 词语' : count + ' 词', isEncode);
  }

  /** 单条中文语料 → 内容对象 */
  function zhItem(item, label, isEncode) {
    return zhItems([item], label, isEncode);
  }

  /** 多条中文语料拼成一段 */
  function zhItems(items, label, isEncode) {
    // 用空格连接，避免目标里出现换行符
    var hanText = items.map(function (i) { return i.t; }).join(' ');
    var pyText = items.map(function (i) { return i.p; }).join(' ');

    if (!isEncode) {
      // IME 实测模式：目标就是汉字本身
      return {
        target: Array.from(hanText),
        align: null,
        hanChars: null,
        groups: null,
        ime: true,
        label: label + ' · IME',
        hint: TM.i18n.get() === 'zh'
          ? '用你自己的输入法打这些字（点击文字区开始）'
          : 'Use your own IME to type these characters'
      };
    }

    var built = TM.pinyin.buildCodeTarget({ t: hanText, p: pyText }, S.scheme);

    return {
      target: built.target,
      align: built.align,
      hanChars: built.chars,
      groups: built.groups,
      ime: false,
      label: label + ' · ' + schemeLabel(S.scheme),
      hint: TM.i18n.get() === 'zh'
        ? '看汉字，敲对应的' + schemeLabel(S.scheme) + '编码'
        : 'Read the character, type its ' + schemeLabel(S.scheme) + ' code'
    };
  }

  function schemeLabel(id) {
    var map = {
      pinyin: TM.i18n.t('engine.scheme.pinyin'),
      xiaohe: TM.i18n.t('engine.sp.xiaohe'),
      ziranma: TM.i18n.t('engine.sp.ziranma'),
      microsoft: TM.i18n.t('engine.sp.microsoft'),
      sogou: TM.i18n.t('engine.sp.sogou')
    };
    return map[id] || '拼音';
  }

  function plainContent(text, label) {
    return {
      target: Array.from(text),
      align: null,
      hanChars: null,
      groups: null,
      ime: false,
      label: label || '',
      hint: TM.i18n.t('common.ready')
    };
  }

  /* ---------- 自定义文本 ---------- */
  var CUSTOM_KEY = 'tm.customText';

  function getCustomText() {
    try { return localStorage.getItem(CUSTOM_KEY) || ''; } catch (e) { return ''; }
  }

  function setCustomText(txt) {
    try { localStorage.setItem(CUSTOM_KEY, txt); } catch (e) {}
  }

  /* =========================================================
     引擎回调
     ========================================================= */
  function onEngineStart() {
    if (!currentRun) return;
    currentRun.started = true;
    util.$('#caretHint').textContent = TM.i18n.t('practice.tab');

    startTimer();
  }

  function onEngineRestart() {
    stopTimer();
    var r = util.$('#result');
    if (r) { r.hidden = true; r.innerHTML = ''; }
    if (currentRun) {
      currentRun.started = false;
      currentRun.finished = false;
      currentRun.summary = null;
    }
    util.$('#caretHint').textContent = TM.i18n.t('common.ready');
    updateLiveStats({ elapsed: 0, wpm: 0, rawWpm: 0, cpm: 0, accuracy: 100, correct: 0, wrong: 0, progress: 0, cursor: 0, total: currentRun ? currentRun.content.target.length : 0 });
    if (kbEl) TM.keyboard.markWeak(kbEl, TM.store.weakKeys(8, 10).map(function (w) { return w.code; }));
  }

  function onEngineChar(index, ok, code, ch, expected) {
    if (S.sound && ok) beep(ok);

    // 按键落下的即时反馈（键盘提示的推进交给 onEngineCursor，
    // 这样退格时提示也能跟着退回来）
    if (kbEl && code) TM.keyboard.flash(kbEl, code, ok);
  }

  /** 光标移动：打字前进 / 退格后退都会触发 */
  function onEngineCursor(cursor, nextChar) {
    if (kbEl) TM.keyboard.highlight(kbEl, nextChar, { blind: S.blind });
  }

  function onEngineWord(charIndex) {
    // 中文编码模式：一个字的编码打完了
  }

  function onEngineUpdate(stats) {
    updateLiveStats(stats);
  }

  function updateLiveStats(s) {
    if (!S.showLiveStats) {
      util.$('#liveStats').innerHTML = '';
      return;
    }
    var host = util.$('#liveStats');
    if (!host) return;

    var html = '';
    var isZh = S.langMode === 'zh';

    // 时间 / 进度
    if (S.mode === 'time') {
      var left = Math.max(0, S.timeLimit - s.elapsed);
      html += '<span>' + util.fmtTime(left) + '<span class="lbl">' + TM.i18n.t('common.time') + '</span></span>';
    } else {
      var pct = s.progress ? Math.round(s.progress * 100) : 0;
      html += '<span>' + pct + '%<span class="lbl">' + TM.i18n.t('common.done') + '</span></span>';
    }

    html += '<span>' + (isZh ? s.cpm : s.wpm) + '<span class="lbl">' + (isZh ? TM.i18n.t('result.cpm') : 'wpm') + '</span></span>';
    html += '<span>' + s.accuracy + '%<span class="lbl">' + TM.i18n.t('common.accuracy') + '</span></span>';

    if (s.wrong) {
      html += '<span style="color:var(--wrong)">' + s.wrong + '<span class="lbl">' + TM.i18n.t('common.mistakes') + '</span></span>';
    }

    host.innerHTML = html;
  }

  /* ---------- 计时器（限时模式） ---------- */
  function startTimer() {
    stopTimer();
    if (!currentRun) return;
    if (S.mode !== 'time') return;

    currentRun.limit = S.timeLimit;
    currentRun.t0 = performance.now();

    timerId = setInterval(function () {
      if (!currentRun || currentRun.finished) return;
      var left = currentRun.limit - (performance.now() - currentRun.t0) / 1000;
      if (left <= 0) {
        stopTimer();
        if (engine && !engine.isFinished()) engine.finish();
      }
    }, 100);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  /* ---------- 结束 ---------- */
  function onEngineFinish(run) {
    stopTimer();
    if (!currentRun || currentRun.finished) return;
    currentRun.finished = true;

    var summary = TM.stats.summarize(run);
    currentRun.summary = summary;

    var weak = TM.store.weakKeys(10, 10);

    /* --- 存档 --- */
    var rec = {
      ts: Date.now(),
      mode: S.mode,
      modeLabel: currentRun.label,
      langMode: S.langMode,
      elapsed: summary.elapsed,
      wpm: summary.wpm,
      rawWpm: summary.rawWpm,
      cpm: summary.cpm,
      accuracy: summary.accuracy,
      consistency: summary.consistency,
      burst: summary.burst,
      correct: summary.correct,
      wrong: summary.wrong,
      keystrokes: summary.keystrokes,
      lesson: currentRun.lessonIndex || null
    };
    TM.store.addSession(rec);
    TM.store.flushKeys();

    var pbKey = TM.store.pbKey(S.mode, S.langMode);
    var isPb = TM.store.checkPb(pbKey, summary.wpm);

    /* --- 课程判定 --- */
    if (currentRun.lessonIndex) {
      var lesson = TM.data.lessons.list[currentRun.lessonIndex - 1];
      var speed = S.langMode === 'zh' ? summary.cpm : summary.wpm;
      var passed = summary.accuracy >= lesson.goal.accuracy && speed >= lesson.goal.speed;
      TM.store.passLesson(currentRun.lessonIndex, {
        passed: passed,
        accuracy: summary.accuracy,
        speed: speed
      });
      if (passed) {
        util.toast(TM.i18n.t('toast.lessonPassed'), 'ok', 2600);
      } else {
        util.toast(TM.i18n.t('lesson.notClear') + ' — ' +
          TM.i18n.t('lesson.goal.desc', { acc: lesson.goal.accuracy, spd: lesson.goal.speed }), '', 3000);
      }
    }

    if (isPb) util.toast('🎉 ' + TM.i18n.t('toast.pb'), 'ok', 2600);
    if (summary.wrong === 0 && summary.keystrokes > 20) {
      setTimeout(function () { util.toast(TM.i18n.t('toast.noErrors'), 'ok'); }, 400);
    }

    /* --- 渲染结果 --- */
    var host = util.$('#result');
    host.innerHTML = '';
    host.hidden = false;

    var resultNode = TM.views.renderResult(run, summary, {
      label: currentRun.label,
      weak: weak,
      lessonIndex: currentRun.lessonIndex
    });
    host.appendChild(resultNode);

    bindResultActions(host, summary, run);

    if (kbEl) TM.keyboard.markWeak(kbEl, weak.map(function (w) { return w.code; }));

    host.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function bindResultActions(host, summary, run) {
    host.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.getAttribute('data-act');

      if (act === 'again') {
        engine.restart();
        util.$('#result').hidden = true;
        focusEngine();
      } else if (act === 'copy') {
        util.copy(TM.views.shareText(summary, S.langMode === 'zh')).then(function () {
          util.toast(TM.i18n.t('toast.copied'), 'ok');
        });
      } else if (act === 'drill-errors') {
        // 用错得最多的字符生成一段专练
        var keys = Object.keys(run.mistakes || {});
        if (!keys.length) return;
        var text = '';
        while (text.length < 160) {
          text += util.pick(keys) + util.pick(keys);
          text += keys.length > 2 ? util.pick(keys) : '';
          text += ' ';
        }
        engine.load({ target: Array.from(text), align: null, hanChars: null, groups: null, ime: false });
        util.$('#result').hidden = true;
        currentRun.label = 'error drill';
        focusEngine();
      }
    });
  }

  /* =========================================================
     键盘
     ========================================================= */
  function buildKeyboard() {
    var wrap = util.$('#keyboardWrap');
    wrap.innerHTML = '';

    if (!S.showKeyboard) { kbEl = null; return; }

    kbEl = TM.keyboard.render();
    wrap.appendChild(kbEl);

    if (S.showHands) {
      wrap.appendChild(TM.keyboard.renderHands(null));
    }

    var weak = TM.store.weakKeys(8, 10);
    if (weak.length) TM.keyboard.markWeak(kbEl, weak.map(function (w) { return w.code; }));
  }

  function updateKeyboardHints() {
    if (!kbEl) return;
    var nextChar = currentRun ? currentRun.content.target[0] : null;
    TM.keyboard.highlight(kbEl, nextChar, { blind: S.blind });
  }

  /* =========================================================
     工具条
     ========================================================= */
  function bindToolbar(host) {
    host.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-set]');
      if (!btn) return;
      var key = btn.getAttribute('data-set');
      var raw = btn.getAttribute('data-val');
      var val = raw;

      if (key === 'timeLimit' || key === 'wordCount') val = parseInt(raw, 10);

      // extra 组合键
      if (key === 'extra') {
        S.punctuation = (val === 'punct' || val === 'both');
        S.numbers = (val === 'num' || val === 'both');
        TM.store.saveSettings();
        rebuildAll();
        return;
      }

      S[key] = val;

      // 切换语言/输入方式时清空模式相关的旧选择
      if (key === 'langMode') {
        S.quoteSource = val === 'zh' ? 'poem' : 'quote';
      }
      if (key === 'contentType' && val === 'code') {
        S.mode = 'words';
      }

      TM.store.saveSettings();

      if (key === 'fontSize') { applyFontSize(val); return; }
      if (key === 'showLiveStats' || key === 'showKeyboard') { TM.store.saveSettings(); }

      rebuildAll();
    });

    host.addEventListener('change', function (e) {
      var sel = e.target.closest('select[data-set]');
      if (!sel) return;
      S[sel.getAttribute('data-set')] = sel.value;
      TM.store.saveSettings();
      rebuildAll();
    });
  }

  /* =========================================================
     课程
     ========================================================= */
  function bindLessonCards(host) {
    host.addEventListener('click', function (e) {
      var card = e.target.closest('[data-lesson]');
      if (!card) return;
      if (card.classList.contains('locked')) {
        util.toast(TM.i18n.t('common.locked'));
        return;
      }
      var idx = parseInt(card.getAttribute('data-lesson'), 10);
      startLesson(idx);
    });
  }

  function startLesson(idx) {
    var lesson = TM.data.lessons.list[idx - 1];
    if (!lesson) return;

    // 切回练习页并装载课程内容
    util.$$('.view').forEach(function (v) { v.hidden = true; });
    util.$('#view-practice').hidden = false;
    currentView = 'practice';
    util.$$('.nav-item').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-nav') === 'practice');
    });

    // 课程是英文指法，强制英文
    S.langMode = 'en';
    S.contentType = 'text';
    S.mode = 'words';
    S.wordCount = 25;
    S.punctuation = false;
    S.numbers = false;
    TM.store.saveSettings();

    var toolbarHost = util.$('#practiceToolbar');
    toolbarHost.innerHTML = '';
    toolbarHost.appendChild(TM.views.renderToolbar());
    bindToolbar(toolbarHost);

    buildKeyboard();

    var text = TM.data.lessons.generate(lesson, 20);
    var content = plainContent(text, TM.i18n.t('lesson.lesson', { n: idx }));

    if (engine) engine.destroy();
    engine = TM.engine.create({
      container: util.$('#textFlow'),
      target: content.target,
      allowBackspace: S.backspace,
      stopOnError: S.stopOnError,
      onUpdate: onEngineUpdate,
      onChar: onEngineChar,
      onCursor: onEngineCursor,
      onFinish: onEngineFinish,
      onStart: onEngineStart,
      onRestart: onEngineRestart
    });
    engine.mount();

    currentRun = {
      content: content,
      label: TM.i18n.t('lesson.lesson', { n: idx }),
      lessonIndex: idx,
      finished: false,
      summary: null
    };

    util.$('#result').hidden = true;
    util.$('#caretHint').innerHTML = '';

    // 显示本课要点
    var hint = util.$('#caretHint');
    hint.appendChild(el('div', { style: { marginBottom: '4px' } }, lesson.note));
    hint.appendChild(el('div', {
      style: { fontFamily: 'var(--font-mono)', color: 'var(--accent)', fontSize: '12px' }
    }, lesson.newKeys.length
        ? '→ ' + lesson.newKeys.map(function (k) { return k === 'Shift' ? '⇧' : k.toUpperCase(); }).join('  ')
        : '✓ review'));

    if (kbEl) {
      // 先刷新下一个待按键，再叠加本课重点键位
      // （highlight 会清掉所有 next，顺序反了会把本课标记冲掉）
      TM.keyboard.highlight(kbEl, content.target[0], { blind: S.blind });
      lesson.newKeys.forEach(function (k) {
        var code = k === 'Shift' ? 'ShiftLeft' : k;
        var node = kbEl.querySelector('.kb-key[data-code="' + CSS.escape(code) + '"]');
        if (node) node.classList.add('next');
      });
    }

    updateLiveStats({ elapsed: 0, wpm: 0, rawWpm: 0, cpm: 0, accuracy: 100, correct: 0, wrong: 0, progress: 0, cursor: 0, total: content.target.length });
    focusEngine();
  }

  /* =========================================================
     游戏
     ========================================================= */
  function bindGameCards(host) {
    host.addEventListener('click', function (e) {
      var card = e.target.closest('[data-game]');
      if (!card) return;
      openGame(card.getAttribute('data-game'));
    });
  }

  function openGame(id) {
    destroyGame();
    util.$$('.view').forEach(function (v) { v.hidden = true; });
    var view = util.$('#view-games');
    view.hidden = false;
    currentView = 'games';
    util.$$('.nav-item').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-nav') === 'games');
    });

    view.innerHTML = '';
    gameInst = TM.games.start(id, view, {
      level: 'normal',
      langMode: S.langMode,
      onExit: function () {
        destroyGame();
        renderView('games');
      }
    });
  }

  function destroyGame() {
    if (gameInst) {
      try { gameInst.destroy(); } catch (e) {}
      gameInst = null;
    }
  }

  /* =========================================================
     设置抽屉 / 快捷键
     ========================================================= */
  function openDrawer() {
    var mask = util.$('#drawerMask');
    var drawer = util.$('#drawerSettings');

    drawer.innerHTML = '';
    drawer.appendChild(TM.views.renderSettings());
    drawer.hidden = false;
    mask.hidden = false;

    drawer.addEventListener('click', drawerClick);
    drawer.addEventListener('change', function (e) {
      var sel = e.target.closest('select[data-set]');
      if (!sel) return;
      S[sel.getAttribute('data-set')] = sel.value;
      TM.store.saveSettings();
      rebuildAll();
    });
  }

  function drawerClick(e) {
    var sw = e.target.closest('[data-toggle]');
    if (sw) {
      var key = sw.getAttribute('data-toggle');
      S[key] = !S[key];
      sw.classList.toggle('on', S[key]);
      sw.setAttribute('aria-pressed', S[key] ? 'true' : 'false');
      TM.store.saveSettings();
      if (key === 'fontSize') { /* noop */ }
      if (currentView === 'practice') buildKeyboard();
      return;
    }

    var th = e.target.closest('[data-theme-set]');
    if (th) {
      var name = th.getAttribute('data-theme-set');
      S.theme = name;
      TM.store.saveSettings();
      applyTheme(name);
