/* =========================================================
   Typing Master · 打字大师
   样式系统 — 主题变量 / 布局 / 组件
   零外部依赖，离线可用
   ========================================================= */

/* ---------- 1. 主题 ---------- */
:root {
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
             "Helvetica Neue", "Microsoft YaHei", "Noto Sans SC", sans-serif;

  --radius-s: 6px;
  --radius: 10px;
  --radius-l: 16px;
  --shadow: 0 8px 32px rgba(0, 0, 0, .38);
  --ease: cubic-bezier(.4, 0, .2, 1);
}

/* 关键：HTML 的 hidden 属性优先级低于类选择器上的 display，
   必须强制兜底，否则 .modal-mask / .drawer 这类带 display 的容器
   会无视 hidden 一直盖在页面上（表现：整体变暗、鼠标点不动、中间出现灰框）。 */
[hidden] { display: none !important; }

/* 深色 · 琥珀（默认） */
html[data-theme="dark"] {
  --bg: #0f1117;
  --bg-soft: #151824;
  --bg-elev: #1b1f2e;
  --bg-input: #10131d;
  --border: #262c3e;
  --border-soft: #1e2333;
  --text: #e7eaf2;
  --text-dim: #8a93ab;
  --text-faint: #4d566e;
  --accent: #ffc94a;
  --accent-soft: rgba(255, 201, 74, .14);
  --correct: #7ee787;
  --wrong: #ff6b6b;
  --wrong-soft: rgba(255, 107, 107, .16);
  --extra: #c792ea;
  --shadow: 0 8px 32px rgba(0, 0, 0, .5);
  --kb-key: #1e2333;
  --kb-key-edge: #2c3348;
}

/* 深色 · 冰蓝 */
html[data-theme="ocean"] {
  --bg: #0b1220;
  --bg-soft: #101a2c;
  --bg-elev: #16203a;
  --bg-input: #0d1526;
  --border: #22304d;
  --border-soft: #1a2439;
  --text: #e3ecf7;
  --text-dim: #8194b3;
  --text-faint: #465878;
  --accent: #4dabf7;
  --accent-soft: rgba(77, 171, 247, .15);
  --correct: #63e6be;
  --wrong: #ff8787;
  --wrong-soft: rgba(255, 135, 135, .16);
  --extra: #9775fa;
  --shadow: 0 8px 32px rgba(0, 0, 0, .55);
  --kb-key: #17243c;
  --kb-key-edge: #24365a;
}

/* 深色 · 松绿 */
html[data-theme="forest"] {
  --bg: #0c1410;
  --bg-soft: #111c17;
  --bg-elev: #17241e;
  --bg-input: #0e1813;
  --border: #21362b;
  --border-soft: #1a2a22;
  --text: #e4f0e8;
  --text-dim: #86a292;
  --text-faint: #4a6355;
  --accent: #6ee7a0;
  --accent-soft: rgba(110, 231, 160, .14);
  --correct: #6ee7a0;
  --wrong: #ff8a8a;
  --wrong-soft: rgba(255, 138, 138, .15);
  --extra: #ffd166;
  --shadow: 0 8px 32px rgba(0, 0, 0, .5);
  --kb-key: #18271f;
  --kb-key-edge: #24402f;
}

/* 深色 · 紫罗兰 */
html[data-theme="violet"] {
  --bg: #100e1a;
  --bg-soft: #16132a;
  --bg-elev: #1d1935;
  --bg-input: #120f20;
  --border: #2c2650;
  --border-soft: #221d3e;
  --text: #ebe8f7;
  --text-dim: #948cb8;
  --text-faint: #554d7a;
  --accent: #b197fc;
  --accent-soft: rgba(177, 151, 252, .16);
  --correct: #69db7c;
  --wrong: #ff8787;
  --wrong-soft: rgba(255, 135, 135, .16);
  --extra: #ffd43b;
  --shadow: 0 8px 32px rgba(0, 0, 0, .55);
  --kb-key: #1e1a37;
  --kb-key-edge: #2e2855;
}

/* 浅色 · 纸张 */
html[data-theme="light"] {
  --bg: #f6f7f9;
  --bg-soft: #ffffff;
  --bg-elev: #ffffff;
  --bg-input: #eef0f4;
  --border: #dfe3ea;
  --border-soft: #e9ecf1;
  --text: #1c2230;
  --text-dim: #6b7488;
  --text-faint: #a7aebd;
  --accent: #e8890c;
  --accent-soft: rgba(232, 137, 12, .12);
  --correct: #199c4a;
  --wrong: #e03131;
  --wrong-soft: rgba(224, 49, 49, .12);
  --extra: #7048e8;
  --shadow: 0 6px 24px rgba(20, 30, 50, .12);
  --kb-key: #ffffff;
  --kb-key-edge: #d3d8e0;
}

/* ---------- 2. 基础 ---------- */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background .25s var(--ease), color .25s var(--ease);
  overflow-x: hidden;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button { cursor: pointer; border: none; background: none; }

::selection { background: var(--accent-soft); color: var(--text); }

/* 滚动条 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 5px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

.ico { width: 18px; height: 18px; display: block; }

/* ---------- 3. 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 22px;
  height: 58px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border-soft);
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  user-select: none;
  flex-shrink: 0;
}
.brand-mark { width: 24px; height: 24px; color: var(--accent); flex-shrink: 0; }
.brand-text {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.3px;
  white-space: nowrap;
}
.brand-accent { color: var(--accent); }

.nav {
  display: flex;
  gap: 2px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }

.nav-item {
  padding: 6px 14px;
  border-radius: var(--radius-s);
  font-size: 14px;
  color: var(--text-dim);
  white-space: nowrap;
  transition: color .15s, background .15s;
}
.nav-item:hover { color: var(--text); background: var(--bg-soft); }
.nav-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.topbar-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

.icon-btn {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-s);
  color: var(--text-dim);
  transition: color .15s, background .15s;
}
.icon-btn:hover { color: var(--text); background: var(--bg-soft); }

.lang-btn {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 34px;
  padding: 0 10px;
  border-radius: var(--radius-s);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  font-family: var(--font-mono);
  transition: background .15s;
}
.lang-btn:hover { background: var(--bg-soft); }
.lang-opt { transition: color .15s; }
.lang-opt.active { color: var(--accent); }
.lang-sep { opacity: .35; }

/* ---------- 4. 主容器 ---------- */
#main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 26px 22px 80px;
}

.view[hidden] { display: none; }

/* ---------- 5. 工具条 ---------- */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 12px;
  margin-bottom: 8px;
  background: var(--bg-soft);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  font-size: 13px;
  transition: opacity .2s;
}
.toolbar.faded { opacity: .28; }
.toolbar:hover { opacity: 1; }

.tb-group { display: flex; align-items: center; gap: 2px; }
.tb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 7px; }

.tb-group > label {
  color: var(--text-faint);
  margin-right: 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .3px;
}

.tb-btn {
  padding: 4px 10px;
  border-radius: var(--radius-s);
  color: var(--text-dim);
  font-size: 13px;
  transition: color .12s, background .12s;
  white-space: nowrap;
}
.tb-btn:hover { color: var(--text); background: var(--bg-elev); }
.tb-btn.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.tb-select, .tb-input {
  padding: 5px 9px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color .15s;
}
.tb-select:focus, .tb-input:focus { border-color: var(--accent); }
.tb-input { min-width: 120px; }

/* ---------- 6. 打字舞台 ---------- */
.stage {
  position: relative;
  padding: 26px 20px 14px;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.typing-zone { position: relative; }

/* 顶部实时统计 */
.live-stats {
  display: flex;
  align-items: baseline;
  gap: 22px;
  margin-bottom: 14px;
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  min-height: 30px;
  transition: opacity .2s;
}
.live-stats .lbl {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-left: 4px;
}

/* 文本流 */
.text-flow {
  font-family: var(--font-mono);
  font-size: 27px;
  line-height: 1.75;
  letter-spacing: .2px;
  color: var(--text-faint);
  outline: none;
  cursor: text;
  word-break: break-word;
  user-select: none;
  -webkit-user-select: none;
  transition: font-size .15s;
  max-height: 46vh;
  overflow-y: auto;
  position: relative;
  padding-bottom: 4px;
  scroll-behavior: smooth;
}
.text-flow.size-s { font-size: 21px; }
.text-flow.size-l { font-size: 33px; }

/* 字符状态 */
.ch { position: relative; transition: color .06s linear; }
.ch.correct { color: var(--text); }
.ch.wrong {
  color: var(--wrong);
  animation: chShake .16s var(--ease);
}
.ch.wrong::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: .1em;
  height: 2px;
  background: var(--wrong);
  border-radius: 1px;
}
.ch.extra {
  color: var(--extra);
  opacity: .8;
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
}
.ch.pending { color: var(--text-faint); }

/* 光标 */
.ch.caret::before {
  content: '';
  position: absolute;
  left: -.5px;
  top: .08em;
  bottom: .18em;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
  animation: caretBlink 1s step-end infinite;
}
.text-flow.typing .ch.caret::before { animation: none; opacity: 1; }

/* 所有已输入字符都不再闪烁光标 */
.ch.correct.caret::before,
.ch.wrong.caret::before { animation: none; }

/* ---------- 编码跟打模式：分组布局 ---------- */
.flow-inner { display: inline; white-space: pre-wrap; }

.text-flow .sp { white-space: pre; }

.grp-flow { display: block; line-height: 2.55; }

.grp {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  margin: 0 1px;
  padding: 0 3px 2px;
  border-radius: 5px;
  transition: background .12s;
}
.grp.active {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
}

.grp-han {
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.3;
  color: var(--text-faint);
  letter-spacing: 0;
  min-height: 17px;
  user-select: none;
}
.grp-han.punct { visibility: hidden; }
.grp.active .grp-han { color: var(--accent); font-weight: 600; }

.grp-code { display: inline-flex; }

/* 分组内字符稍微压缩一点，避免太宽 */
.grp-code .ch { font-size: .86em; }

/* IME 隐藏输入框 */
.ime-input {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  border: none;
  outline: none;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  cursor: text;
  font-size: 16px;   /* 防止 iOS 缩放 */
}
.ime-flow { position: relative; }

@keyframes caretBlink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }
@keyframes chShake { 0%,100% { transform: translateX(0) } 33% { transform: translateX(-2px) } 66% { transform: translateX(2px) } }

/* 行高亮：当前行以外的行变淡 */
.text-flow.focus-line .ch:not(.in-current-line) { opacity: .32; }
.text-flow.focus-line .ch.in-current-line { opacity: 1; }

/* 中文标注拼音 */
.ch .pinyin {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: -1.35em;
  font-size: .42em;
  color: var(--text-faint);
  letter-spacing: 0;
  white-space: nowrap;
  pointer-events: none;
  font-weight: 400;
}
.ch.correct .pinyin { color: var(--correct); opacity: .75; }
.ch.wrong .pinyin { color: var(--wrong); }

/* 提示覆盖层 */
.caret-hint {
  text-align: center;
  font-size: 13px;
  color: var(--text-faint);
  margin-top: 12px;
  min-height: 20px;
  transition: opacity .3s;
}

/* IME 回显 */
.ime-echo {
  position: absolute;
  left: 0; bottom: -4px;
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--accent);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: 3px 10px;
  pointer-events: none;
}

/* ---------- 7. 键盘 ---------- */
.kb-wrap {
  margin-top: 34px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.kb {
  --k: 42px;
  --g: 5px;
  display: flex;
  flex-direction: column;
  gap: var(--g);
  padding: 12px;
  background: color-mix(in srgb, var(--kb-key) 45%, var(--bg));
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  user-select: none;
  transition: opacity .25s;
}
.kb.kb-hidden { display: none; }

.kb-row { display: flex; gap: var(--g); justify-content: center; }

.kb-key {
  position: relative;
  height: var(--k);
  min-width: var(--k);
  padding: 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--kb-key);
  border: 1px solid var(--kb-key-edge);
  border-bottom-width: 2px;
  border-radius: 7px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  box-shadow: 0 1px 0 rgba(0, 0, 0, .18);
  transition: background .07s, color .07s, transform .07s, border-color .07s;
}

/* 手指分区配色（键帽底部细线） */
.kb-key[data-finger]::after {
  content: '';
  position: absolute;
  left: 6px; right: 6px; bottom: 3px;
  height: 2px;
  border-radius: 1px;
  background: var(--fc, transparent);
  opacity: .55;
}
.kb-key.f-lp { --fc: #ff6b6b; }  /* 左小指 */
.kb-key.f-lr { --fc: #ffa94d; }  /* 左无名 */
.kb-key.f-lm { --fc: #ffd43b; }  /* 左中指 */
.kb-key.f-li { --fc: #69db7c; }  /* 左食指 */
.kb-key.f-ri { --fc: #4dabf7; }  /* 右食指 */
.kb-key.f-rm { --fc: #b197fc; }  /* 右中指 */
.kb-key.f-rr { --fc: #f783ac; }  /* 右无名 */
.kb-key.f-rp { --fc: #63e6be; }  /* 右小指 */
.kb-key.f-th { --fc: #adb5bd; }  /* 拇指 */

/* 键帽宽度类 */
.kb-key.w-backspace { min-width: calc(var(--k) * 1.9); justify-content: flex-end; padding-right: 10px; font-size: 10px; }
.kb-key.w-tab     { min-width: calc(var(--k) * 1.5); justify-content: flex-start; padding-left: 10px; font-size: 10px; }
.kb-key.w-backslash { min-width: calc(var(--k) * 1.4); }
.kb-key.w-caps    { min-width: calc(var(--k) * 1.85); justify-content: flex-start; padding-left: 10px; font-size: 10px; }
.kb-key.w-return  { min-width: calc(var(--k) * 2.3); justify-content: flex-end; padding-right: 10px; font-size: 10px; }
.kb-key.w-lshift  { min-width: calc(var(--k) * 2.5); justify-content: flex-start; padding-left: 10px; font-size: 10px; }
.kb-key.w-rshift  { min-width: calc(var(--k) * 2.5); justify-content: flex-end; padding-right: 10px; font-size: 10px; }
.kb-key.w-fn      { min-width: calc(var(--k) * 1.25); font-size: 9.5px; }
.kb-key.w-ctrl    { min-width: calc(var(--k) * 1.25); font-size: 9.5px; }
.kb-key.w-alt     { min-width: calc(var(--k) * 1.4); font-size: 9.5px; }
.kb-key.w-cmd     { min-width: calc(var(--k) * 1.5); font-size: 13px; }
.kb-key.w-space   { min-width: calc(var(--k) * 7); font-size: 9.5px; }
.kb-key.w-arrow   { min-width: calc(var(--k) * .92); font-size: 13px; }

/* 高亮状态 */
.kb-key.press {
  background: var(--accent);
  border-color: var(--accent);

<script>
/* =========================================================
   util.js — 通用工具
   全局命名空间：TM.util
   ========================================================= */
window.TM = window.TM || {};

TM.util = (function () {
  'use strict';

  /** 区间随机整数 [min, max] */
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  /** 从数组随机取一个 */
  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  /** 洗牌（返回新数组，不改原数组） */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /** 按权重随机取（items = [{w:number, ...}]） */
  function pickWeighted(items) {
    var total = 0;
    for (var i = 0; i < items.length; i++) total += (items[i].w || 0);
    if (total <= 0) return items.length ? items[0] : null;
    var r = Math.random() * total;
    for (var k = 0; k < items.length; k++) {
      r -= (items[k].w || 0);
      if (r <= 0) return items[k];
    }
    return items[items.length - 1];
  }

  /** 限幅 */
  function clamp(v, min, max) {
    return v < min ? min : (v > max ? max : v);
  }

  /**
   * 格式化秒数为 m:ss
   */
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /** 保留小数位（返回数字，非字符串） */
  function round(v, d) {
    var p = Math.pow(10, d || 0);
    return Math.round(v * p) / p;
  }

  /** 均值 */
  function mean(arr) {
    if (!arr.length) return 0;
    var s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return s / arr.length;
  }

  /** 标准差（总体） */
  function stddev(arr) {
    if (arr.length < 2) return 0;
    var m = mean(arr), s = 0;
    for (var i = 0; i < arr.length; i++) s += (arr[i] - m) * (arr[i] - m);
    return Math.sqrt(s / arr.length);
  }

  /**
   * 一致性评分（0-100）
   * 基于每键间隔时间的变异系数 CV = stddev / mean
   * CV 越小越稳定 → 分越高
   */
  function consistency(gaps) {
    if (gaps.length < 3) return 0;
    var valid = gaps.filter(function (g) { return g > 0 && g < 3000; });
    if (valid.length < 3) return 0;
    var m = mean(valid);
    if (m <= 0) return 0;
    var cv = stddev(valid) / m;
    return round(clamp((1 - cv) * 100, 0, 100), 1);
  }

  /** 创建 DOM */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!attrs.hasOwnProperty(k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'text') node.textContent = v;
        else if (k === 'style' && typeof v === 'object') {
          for (var s in v) if (v.hasOwnProperty(s)) node.style[s] = v[s];
        }
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        }
        else node.setAttribute(k, v);
      }
    }
    if (children) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return node;
  }

  /** $ 选择器 */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  /** 转义 HTML */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** 判定字符是否为中日韩统一表意文字 */
  function isCJK(ch) {
    if (!ch) return false;
    var c = ch.codePointAt(0);
    return (c >= 0x4E00 && c <= 0x9FFF) ||   // 基本汉字
           (c >= 0x3400 && c <= 0x4DBF) ||   // 扩展 A
           (c >= 0xF900 && c <= 0xFAFF);     // 兼容表意
  }

  /** 判定是否空格类 */
  function isSpace(ch) {
    return ch === ' ' || ch === '\u3000' || ch === '\t';
  }

  /** 防抖 */
  function debounce(fn, wait) {
    var t = null;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  }

  /** 节流（requestAnimationFrame 版） */
  function rafThrottle(fn) {
    var scheduled = false, lastArgs = null;
    return function () {
      lastArgs = arguments;
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function () {
        scheduled = false;
        fn.apply(null, lastArgs);
      });
    };
  }

  /** 简易提示 */
  function toast(msg, type, ms) {
    var host = document.getElementById('toastHost');
    if (!host) return;
    var t = el('div', { class: 'toast' + (type ? ' ' + type : ''), text: msg });
    host.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .3s, transform .3s';
      t.style.opacity = '0';
      t.style.transform = 'translateY(10px)';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);
    }, ms || 1800);
  }

  /** 本地日期键 YYYY-MM-DD */
  function todayKey(d) {
    d = d || new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  /** 相对时间描述 */
  function timeAgo(ts, lang) {
    var diff = Date.now() - ts;
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return lang === 'zh' ? '刚刚' : 'just now';
    if (mins < 60) return lang === 'zh' ? mins + ' 分钟前' : mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return lang === 'zh' ? hrs + ' 小时前' : hrs + 'h ago';
    var days = Math.floor(hrs / 24);
    if (days < 30) return lang === 'zh' ? days + ' 天前' : days + 'd ago';
    return new Date(ts).toLocaleDateString();
  }

  /** 生成 uuid-ish id */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /** 复制到剪贴板（带降级） */
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  return {
    randInt: randInt, pick: pick, shuffle: shuffle, pickWeighted: pickWeighted,
    clamp: clamp, fmtTime: fmtTime, round: round, mean: mean, stddev: stddev,
    consistency: consistency, el: el, $: $, $$: $$, esc: esc, isCJK: isCJK,
    isSpace: isSpace, debounce: debounce, rafThrottle: rafThrottle, toast: toast,
    todayKey: todayKey, timeAgo: timeAgo, uid: uid, copy: copy
  };
})();

</script>

<script>
/* =========================================================
   data/lessons.js — 指法课程体系（六阶段 / MacBook 键盘）

   ========================================================= */
window.TM = window.TM || {};
TM.data = TM.data || {};

TM.data.lessons = (function () {

    },
    {

      lessons: [

        { newKeys: ['w', 'o'], note: '无名指向上，扭一点是正常的。' },
        { newKeys: ['q', 'p'], note: '小指向上伸展，这是小指最难的两个键。' }
      ]
    },
    {
      id: 'bottom',
      nameKey: 'lesson.stage.bottom',
      lessons: [
        { newKeys: ['v', 'm'], note: '食指向下。手不要整个往下挪。' },
        { newKeys: ['c', ','], note: '中指往下。' },
        { newKeys: ['x', '.'], note: '无名指往下。' },
        { newKeys: ['z', '/'], note: '小指往下，够不到就直接往下悬。' }
      ]
    },
    {
      id: 'number',
      nameKey: 'lesson.stage.number',
      lessons: [
        { newKeys: ['1', '2', '3', '4', '5'], note: '左手管 1-5，直接用手指向上够。' },
        { newKeys: ['6', '7', '8', '9', '0'], note: '右手管 6-0，食指负责 6 和 7。' },
        { newKeys: ['-', '='], note: '右手小指负责 - 和 =。' },
        { newKeys: ['[', ']', "'", '\\'], note: '右手小指伸展区，MacBook 上很容易打滑。' }
      ]
    },
    {
      id: 'shift',
      nameKey: 'lesson.stage.shift',
      lessons: [
        { newKeys: ['Shift'], capitals: true, note: '用另一只手的小指按 Shift，别用同侧。' },
        { newKeys: ['Shift'], capitals: true, mixedCase: true, note: '大小写混合 — 左右手轮流按 Shift 才快。' }
      ]
    },
    {
      id: 'all',
      nameKey: 'lesson.stage.all',
      lessons: [
        { newKeys: [], note: '常用短词 — 目标是连贯，不要一个字一个字地打。' },
        { newKeys: [], longWords: true, note: '长单词 — 手指要提前预判下一个字母。' },
        { newKeys: [], punctuation: true, note: '带标点的句子 — 标点往往是节奏断点。' }
      ]
    }
  ];

  /* 把课程拍平成线性列表，并计算累积键位与目标 */
  function build() {
    var list = [];
    var acc = [];
    var n = 1;

    stages.forEach(function (stage, si) {
      stage.lessons.forEach(function (l, li) {
        (l.newKeys || []).forEach(function (k) {
          if (acc.indexOf(k) === -1) acc.push(k);
        });

        // 目标随阶段递增
        var accGoal = [93, 94, 95, 95, 96, 96][si] || 96;
        var spdGoal = [15, 18, 20, 22, 25, 30][si] || 25;

        list.push({
          index: n++,
          stageId: stage.id,
          stageNameKey: stage.nameKey,
          stageIndex: si,
          lessonInStage: li + 1,
          stageCount: stage.lessons.length,
          newKeys: (l.newKeys || []).slice(),
          allowedKeys: acc.slice(),
          capitals: !!l.capitals,
          mixedCase: !!l.mixedCase,
          longWords: !!l.longWords,
          punctuation: !!l.punctuation,
          isReview: (l.newKeys || []).length === 0,
          note: l.note || '',
          goal: { accuracy: accGoal, speed: spdGoal }
        });
      });
    });

    return list;
  }

  var LIST = build();

  /* 常用短词，供课程生成用 */
  var DRILL_WORDS = ('aa ad ad as ask all add fall dad fad lad lass lads sad salad flask half hall has had jak jakk jakk kaks kals sals dals dask flask glass glass lad lass add all ask dad fad fall half hall jakk lads sad salad flask hak kal lak sak dak fak jak las das fas has ask all add dad fad lad sad jakk ala dad lad jak las das fas has ask all add dad fad lad sad flask glass half hall alall ada dads fads lads sads asked alls fall falls halls salad salads flask flash slash lash dash hash cash gash sash flag flags glad gland jakk klak ala half hall small alls falls halls salad flask flash slash lash dash hash cash gash sash flags glad gland Jakarta').split(' ');

  var HOME_WORDS = 'as ask all add dad fad lad sad has had ash dash hash gash lash sash slash flash half hall fall hall lads lass salad flask glass glad flag flags gland alaska aa'.split(' ');
  var TOP_WORDS = 'we were our your put top out the there where quiet quote trip true type your power tower water quiet quite paper upper people yellow pretty towel wrote tower rut tore type tyre utter utter require liquid where quiet quota utmost require write state treat street slight slight'.split(' ');
  var BOTTOM_WORDS = 'can man van back come move cave memento cinema banana zone zero cave move comic money nice voice zxc xcv vbn mnb zoom mix vex cx cv cz mz mn nm nn mm cc vv zz az za azaz mix max fix six box fox zoo zoo'.split(' ');
  var LONG_WORDS = ('necessary immediately phenomenon questionnaire acknowledge recommendation infrastructure responsibility simultaneously implementation characteristic communication organisation understanding unfortunately environmental administration organization international examination particularly professional relationship performance conversation temperature independent university technology management information population environment development performance experience government understand everything important different difficult knowledge something sometimes according available condition situation education direction determine treatment attention statement structure effective equipment influence establish potential encourage practical technique advantage challenge recognize successful significant traditional association particularly reference knowledge performance').split(' ');

  var PUNCT_SENTENCES = [
    'Yes, that works; let us ship it.',
    'Wait — are you sure?',
    'She said, "Try it again."',
    'Done; finally done!',
    'Cost: $12.50 (20% off).',
    'Hi there, how are you?',
    'No, no, no. Not that one.',
    'A, B, and C — all good.',
    "It's fine, isn't it?"
  ];

  var CAPITAL_WORDS = 'Monday Tuesday Wednesday Thursday Friday Saturday Sunday January February March April May June July August September October November December English Chinese London Paris Tokyo Beijing Java Python React Linux macOS GitHub Apple Google Microsoft Amazon Tesla'.split(' ');

  /**
   * 生成某一课的练习文本
   * @param {object} lesson
   * @param {number} count 需要的单词数
   * @returns {string}
   */
  function generate(lesson, count) {
    var util = TM.util;
    count = count || 18;

    if (lesson.capitals) {
      if (lesson.mixedCase) {
        var bank = CAPITAL_WORDS.concat('the quick brown fox jumps over lazy dog write read speak listen code test build deploy clean merge push pull'.split(' '));
        return util.shuffle(bank).slice(0, count).join(' ');
      }
      return util.shuffle(CAPITAL_WORDS).slice(0, Math.min(count, 14)).join(' ');
    }

    if (lesson.stageId === 'all') {
      if (lesson.punctuation) return util.shuffle(PUNCT_SENTENCES).join(' ');
      if (lesson.longWords) return util.shuffle(LONG_WORDS).slice(0, Math.ceil(count * 0.7)).join(' ');
      // 混合短词
      var mix = util.shuffle(HOME_WORDS.concat(TOP_WORDS, BOTTOM_WORDS));
      return mix.slice(0, count).join(' ');
    }

    if (lesson.stageId === 'number') {
      var nums = '1 2 3 4 5 6 7 8 9 0 12 34 56 78 90 123 456 789 1024 2048 365 100 250 500 750 999 1000 2026 42 88 66 77 11 22 33 44 55 99 10 20 30 40 50'.split(' ');
      var punc = '- = [ ] \' \\ ; / , .'.split(' ');
      var out = [];
      for (var i = 0; i < count; i++) {
        if (i % 5 === 4) out.push(util.pick(punc));
        else out.push(util.pick(nums));
      }
      return out.join(' ');
    }

    // 前四个阶段：用累积的键位过滤词库
    var pool = HOME_WORDS.concat(TOP_WORDS, BOTTOM_WORDS, DRILL_WORDS);
    var allowed = lesson.allowedKeys;
    var capable = pool.filter(function (w) {
      if (w.length < 2) return false;
      for (var i = 0; i < w.length; i++) {
        if (allowed.indexOf(w[i]) === -1) return false;
      }
      return true;
    });

    // 新键专项：先来一串重复新键
    var parts = [];
    (lesson.newKeys || []).forEach(function (k) {
      if (allowed.indexOf(k) === -1) return;
      parts.push((k + k + k));
      parts.push((k + k + k));
    });

    if (capable.length < 6) {
      // 词库不够就纯组合练
      var chunks = [];
      for (var c = 0; c < count; c++) {
        var s = '';
        for (var j = 0; j < util.randInt(2, 4); j++) s += util.pick(allowed);
        chunks.push(s);
      }
      parts = parts.concat(chunks);
      return parts.join(' ');
    }

    var picks = util.shuffle(capable).slice(0, count);
    // 每 4 个词插一段新键操练
    var result = [];
    picks.forEach(function (w, idx) {
      result.push(w);
      if (idx > 0 && idx % 4 === 0 && parts.length) {
        result.push(parts.shift());
      }
    });
    return result.join(' ');
  }

  return {
    stages: stages,
    list: LIST,
    generate: generate,
    count: LIST.length
  };
})();

</script>

  function renderHands(activeFinger) {
    var util = TM.util;
    var lang = TM.i18n.get();
    var box = util.el('div', { class: 'hands' });

    var map = {
      lp: '小指', lr: '无名', lm: '中指', li: '食指',
      ri: '食指', rm: '中指', rr: '无名', rp: '小指', th: '拇指'
    };
    var mapEn = {
      lp: 'pinky', lr: 'ring', lm: 'middle', li: 'index',
      ri: 'index', rm: 'middle', rr: 'ring', rp: 'pinky', th: 'thumb'
    };
    var L = ['lp', 'lr', 'lm', 'li'], R = ['ri', 'rm', 'rr', 'rp'];

      var wrap = util.el('div');
      wrap.appendChild(util.el('div', {}, lang === 'zh'

          style: { color: activeFinger === f ? undefined : FINGERS[f].color }
        }, (lang === 'zh' ? map[f] : mapEn[f]) + ' '));
      });
      wrap.appendChild(line);
      return wrap;
    }

    box.appendChild(side(L));
    box.appendChild(side(R));
    return box;
  }

  return {
    LAYOUTS: LAYOUTS,
    get ROWS() { return idx().rows; },
    FINGERS: FINGERS,
    get BY_CODE() { return idx().byCode; },
    setLayout: setLayout,
    getLayout: getLayout,
    detectLayout: detectLayout,
    charToKey: charToKey,
    fingerOf: fingerOf,
    shiftHand: shiftHand,
    render: render,
    renderLegend: renderLegend,
    renderHands: renderHands,
    highlight: highlight,
    markWeak: markWeak,
    flash: flash
  };
})();

<script>
/* =========================================================
   storage.js — 本地持久化（localStorage）
   TM.store
   所有数据只存在本机，无任何网络请求
   ========================================================= */
window.TM = window.TM || {};

TM.store = (function () {
  'use strict';

  var PREFIX = 'tm.';
  var memory = {};          // localStorage 不可用时的降级
  var available = (function () {
    try {
      var k = PREFIX + '__probe';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })();

  function rawGet(key) {
    if (!available) return memory[key] === undefined ? null : memory[key];
    try { return localStorage.getItem(PREFIX + key); } catch (e) { return null; }
  }

  function rawSet(key, val) {
    if (!available) { memory[key] = val; return; }
    try { localStorage.setItem(PREFIX + key, val); } catch (e) { memory[key] = val; }
  }

  function rawDel(key) {
    if (!available) { delete memory[key]; return; }
    try { localStorage.removeItem(PREFIX + key); } catch (e) {}
  }

  function getJSON(key, fallback) {
    var s = rawGet(key);
    if (s === null || s === undefined || s === '') return fallback;
    try { return JSON.parse(s); } catch (e) { return fallback; }
  }

  function setJSON(key, val) {
    try { rawSet(key, JSON.stringify(val)); } catch (e) {}
  }

  /* ---------- 默认设置 ---------- */
  var DEFAULT_SETTINGS = {
    lang: 'zh',
    theme: 'dark',
    fontSize: 'm',
    showKeyboard: true,
    showHands: false,
    showLiveStats: true,
    focusLine: true,
    strictSpace: false,
    stopOnError: false,
    sound: false,
    autoNext: false,
    hideToolbar: true,
    backspace: true,
    blind: false,

    // 练习偏好
    mode: 'time',
    contentType: 'text',     // 'text' | 'code'
    timeLimit: 30,
    wordCount: 25,
    quoteSource: 'quote',
    langMode: 'en',          // 'en' | 'zh'  —— 练习内容语言
    zhInput: 'encode',       // 'encode' | 'ime'
    scheme: 'pinyin',        // 'pinyin' | 'xiaohe' | ...
    showPinyin: true,
    codeLang: 'javascript',
    punctuation: false,
    numbers: false,

    // 虚拟键盘布局：'' = 自动（按系统），可选 'mac' | 'win'
    kbLayout: ''
  };

  var state = {
    settings: null,
    history: null,
    keys: null,
    lessons: null,
    games: null,
    pbs: null
  };

  function load() {
    var s = getJSON('settings', {});
    state.settings = Object.assign({}, DEFAULT_SETTINGS, s);

    state.history = getJSON('history', []);
    state.keys = getJSON('keys', {});
    state.lessons = getJSON('lessons', {});
    state.games = getJSON('games', {});
    state.pbs = getJSON('pbs', {});

    if (!Array.isArray(state.history)) state.history = [];
  }

  function saveSettings() { setJSON('settings', state.settings); }
  function saveHistory() { setJSON('history', state.history); }
  function saveKeys() { setJSON('keys', state.keys); }
  function saveLessons() { setJSON('lessons', state.lessons); }
  function saveGames() { setJSON('games', state.games); }
  function savePbs() { setJSON('pbs', state.pbs); }

  function set(key, val) {
    state.settings[key] = val;
    saveSettings();
  }

  function settings() { return state.settings; }
  function history() { return state.history; }
  function keys() { return state.keys; }
  function lessons() { return state.lessons; }
  function games() { return state.games; }
  function pbs() { return state.pbs; }

  /* ---------- 逐键统计 ---------- */
  /**
   * @param {string} code  物理键 code（如 'a' / 'Space' / 'ShiftLeft'）
   * @param {boolean} ok
   * @param {number} ms    自上一次敲击到本次的间隔
   */
  function recordKey(code, ok, ms) {
    if (!code) return;
    var k = state.keys[code] || (state.keys[code] = { n: 0, err: 0, t: 0, c: 0 });
    k.n++;
    if (!ok) k.err++;
    if (ms && ms > 0 && ms < 3000) { k.t += ms; k.c++; }
  }

  function flushKeys() { saveKeys(); }

  /** 取某个键的准确率（0-1），样本不足返回 null */
  function keyAccuracy(code, minSample) {
    var k = state.keys[code];
    if (!k || k.n < (minSample || 5)) return null;
    return (k.n - k.err) / k.n;
  }

  /** 取某个键的平均反应时间（ms） */
  function keyLatency(code) {
    var k = state.keys[code];
    if (!k || !k.c) return null;
    return k.t / k.c;
  }

  /** 弱键排行（准确率低 + 反应慢优先） */
  function weakKeys(limit, minSample) {
    minSample = minSample || 8;
    var out = [];
    for (var code in state.keys) {
      if (!state.keys.hasOwnProperty(code)) continue;
      var k = state.keys[code];
      if (k.n < minSample) continue;
      var acc = (k.n - k.err) / k.n;
      var lat = k.c ? k.t / k.c : 0;
      // 综合评分：准确率越低越高，反应越慢越高
      var score = (1 - acc) * 100 + (lat / 1000) * 8;
      out.push({ code: code, acc: acc, latency: lat, n: k.n, err: k.err, score: score });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, limit || 10);
  }

  /** 强键排行 */
  function strongKeys(limit, minSample) {
    minSample = minSample || 8;
    var out = [];
    for (var code in state.keys) {
      if (!state.keys.hasOwnProperty(code)) continue;
      var k = state.keys[code];
      if (k.n < minSample) continue;
      var acc = (k.n - k.err) / k.n;
      var lat = k.c ? k.t / k.c : 9999;
      if (acc < 0.97) continue;
      out.push({ code: code, acc: acc, latency: lat, n: k.n, score: acc * 100 - lat / 100 });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, limit || 6);
  }

  /* ---------- 历史记录 ---------- */
  function addSession(rec) {
    rec.ts = rec.ts || Date.now();
    state.history.unshift(rec);
    if (state.history.length > 800) state.history.length = 800;
    saveHistory();
  }

  /** 按天数范围过滤 */
  function historySince(days) {
    if (!days) return state.history;
    var from = Date.now() - days * 86400000;
    return state.history.filter(function (h) { return h.ts >= from; });
  }

  /** 连续练习天数 */
  function streak() {
    if (!state.history.length) return 0;
    var days = {};
    state.history.forEach(function (h) {
      days[TM.util.todayKey(new Date(h.ts))] = true;
    });
    var n = 0;
    var d = new Date();
    // 今天没练也不断（从昨天往前算）
    if (!days[TM.util.todayKey(d)]) d.setDate(d.getDate() - 1);
    while (days[TM.util.todayKey(d)]) {
      n++;
      d.setDate(d.getDate() - 1);
    }
    return n;
  }

  /* ---------- 课程进度 ---------- */
  function lessonProgress(index) {
    return state.lessons[index] || null;
  }

  function passLesson(index, info) {
    var cur = state.lessons[index];
    if (!cur) {
      state.lessons[index] = { passed: true, bestAcc: info.accuracy, bestSpeed: info.speed, ts: Date.now(), tries: 1 };
    } else {
      cur.passed = cur.passed || !!info.passed;
      cur.tries = (cur.tries || 0) + 1;
      cur.bestAcc = Math.max(cur.bestAcc || 0, info.accuracy || 0);
      cur.bestSpeed = Math.max(cur.bestSpeed || 0, info.speed || 0);
      cur.ts = Date.now();
    }
    saveLessons();
  }

  function passedCount() {
    var n = 0;
    for (var k in state.lessons) {
      if (state.lessons.hasOwnProperty(k) && state.lessons[k].passed) n++;
    }
    return n;
  }

  /* ---------- 游戏成绩 ---------- */
  function recordGame(id, score) {
    var g = state.games[id] || (state.games[id] = { best: 0, plays: 0, last: 0 });
    g.plays++;
    g.last = score;
    var isBest = score > g.best;
    if (isBest) g.best = score;
    saveGames();
    return isBest;
  }

  /* ---------- 个人最佳 ---------- */
  function pbKey(mode, langMode) {
    return langMode + ':' + mode;
  }

  function checkPb(key, wpm) {
    var cur = state.pbs[key];
    if (!cur || wpm > cur.wpm) {
      state.pbs[key] = { wpm: wpm, ts: Date.now() };
      savePbs();
      return true;
    }
    return false;
  }

  function getPb(key) { return state.pbs[key] || null; }

  /* ---------- 导入导出 ---------- */
  function exportAll() {
    return JSON.stringify({
      version: 1,
      exportedAt: new Date().toISOString(),
      settings: state.settings,
      history: state.history,
      keys: state.keys,
      lessons: state.lessons,
      games: state.games,
      pbs: state.pbs
    }, null, 2);
  }

  function importAll(json) {
    var d = typeof json === 'string' ? JSON.parse(json) : json;
    if (d.settings) { state.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings); saveSettings(); }
    if (d.history) { state.history = d.history; saveHistory(); }
    if (d.keys) { state.keys = d.keys; saveKeys(); }
    if (d.lessons) { state.lessons = d.lessons; saveLessons(); }
    if (d.games) { state.games = d.games; saveGames(); }
    if (d.pbs) { state.pbs = d.pbs; savePbs(); }
  }

  function wipe() {
    ['settings', 'history', 'keys', 'lessons', 'games', 'pbs'].forEach(rawDel);
    state.history = [];
    state.keys = {};
    state.lessons = {};
    state.games = {};
    state.pbs = {};
    state.settings = Object.assign({}, DEFAULT_SETTINGS);
    saveSettings();
  }

  load();

  return {
    DEFAULT_SETTINGS: DEFAULT_SETTINGS,
    available: function () { return available; },
    load: load,
    settings: settings,
    set: set,
    saveSettings: saveSettings,
    history: history,
    historySince: historySince,
    addSession: addSession,
    streak: streak,
    keys: keys,
    recordKey: recordKey,
    flushKeys: flushKeys,
    keyAccuracy: keyAccuracy,
    keyLatency: keyLatency,
    weakKeys: weakKeys,
    strongKeys: strongKeys,
    lessons: lessons,
    lessonProgress: lessonProgress,
    passLesson: passLesson,
    passedCount: passedCount,
    games: games,
    recordGame: recordGame,
    pbKey: pbKey,
    checkPb: checkPb,
    getPb: getPb,
    exportAll: exportAll,
    importAll: importAll,
    wipe: wipe
  };
})();

</script>

<script>
/* =========================================================
   stats.js — 指标计算 + 轻量 Canvas 图表
   TM.stats
   ========================================================= */
window.TM = window.TM || {};

TM.stats = (function () {
  'use strict';

  var util = TM.util;

  /**
   * 汇总一次练习的完整指标
   * @param {object} run engine 导出的原始记录
   *   {
   *     keystrokes: [{t, ok, code, char}],   // 每次按键
   *     elapsed,                              // 秒
   *     correctChars, totalTyped, wrongChars,
   *     groupDone,                            // 中文：完成的字数
   *     hasGroups
   *   }
   */
  function summarize(run) {
    var ks = run.keystrokes || [];
    var elapsed = Math.max(run.elapsed || 0, 0.001);

    var minutes = elapsed / 60;

    // 按键级
    var total = ks.length;
    var okCount = 0;
    for (var i = 0; i < total; i++) if (ks[i].ok) okCount++;
    if (run.totalTyped !== undefined && !total) total = run.totalTyped;

    var correctChars = run.correctChars || 0;
    var wrongChars = run.wrongChars || 0;

    // WPM：以"标准词 = 5 字符"换算
    var rawWpm = (total / 5) / minutes;
    var netWpm = (correctChars / 5) / minutes;

    // 中文专用：字/分钟
    var cpm = correctChars / minutes;
    var charsPerMin = run.hasGroups ? (run.groupDone || 0) / minutes : null;

    // 准确率
    var accuracy = total ? (okCount / total) * 100 : 0;

    // 一致性
    var gaps = [];
    var prev = null;
    for (var j = 0; j < ks.length; j++) {
      var t = ks[j].t;
      if (prev !== null && t > prev) gaps.push(t - prev);
      prev = t;
    }
    var consistency = util.consistency(gaps);

    // 爆发速度：最佳 1 秒窗口
    var burst = 0;
    if (ks.length >= 2) {
      var start = 0;
      for (var e = 0; e < ks.length; e++) {
        while (ks[e].t - ks[start].t > 1000) start++;
        var cnt = e - start + 1;
        var span = Math.max(ks[e].t - ks[start].t, 250) / 1000;
        var w = (cnt / 5) / (span / 60);
        if (w > burst) burst = w;
      }
    }

    // 每秒曲线
    var curve = [];
    var seconds = Math.max(1, Math.ceil(elapsed));
    var running = 0, runningOk = 0;
    var ptr = 0;
    for (var s = 1; s <= seconds; s++) {
      var limitMs = s * 1000;
      while (ptr < ks.length && (ks[ptr].t - ks[0].t) <= limitMs) {
        running++;
        if (ks[ptr].ok) runningOk++;
        ptr++;
      }
      var secWpm = (running / 5) / (s / 60);
      curve.push({ s: s, wpm: secWpm, ok: runningOk, err: running - runningOk });
    }

    // 错误时间点
    var errPoints = [];
    var cum = 0;
    for (var m = 0; m < ks.length; m++) {
      if (!ks[m].ok) {
        cum++;
        errPoints.push({ t: (ks[m].t - ks[0].t) / 1000, cum: cum });
      }
    }

    return {
      elapsed: util.round(elapsed, 1),
      rawWpm: Math.round(rawWpm),
      netWpm: Math.round(netWpm),
      wpm: Math.round(netWpm),
      cpm: Math.round(cpm),
      charsPerMin: charsPerMin ? Math.round(charsPerMin) : null,
      accuracy: util.round(accuracy, 1),
      consistency: consistency,
      burst: Math.round(burst),
      keystrokes: total,
      correct: correctChars,
      wrong: wrongChars,
      curve: curve,
      errPoints: errPoints,
      gaps: gaps
    };
  }

  /** 评级（给结果页一个直观标签） */
  function grade(wpm, acc, langMode) {
    // 中文按字/分钟衡量
    var speedForGrade = langMode === 'zh' ? wpm * 1.6 : wpm;
    var s = 0;
    if (speedForGrade >= 120) s = 5;
    else if (speedForGrade >= 90) s = 4;
    else if (speedForGrade >= 65) s = 3;
    else if (speedForGrade >= 45) s = 2;
    else if (speedForGrade >= 28) s = 1;
    if (acc < 90) s = Math.min(s, 2);
    else if (acc < 95) s = Math.min(s, 3);
    else if (acc < 98) s = Math.min(s, 4);
    return s;   // 0-5
  }

  /* ================= Canvas 基础 ================= */

  function prep(canvas) {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var w = rect.width || canvas.parentNode.clientWidth || 600;
    var h = canvas.getAttribute('data-h') ? parseInt(canvas.getAttribute('data-h'), 10) : 150;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.height = h + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx: ctx, w: w, h: h };
  }

  function cssVar(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return (v && v.trim()) || fallback;
  }

  /** 速度曲线折线图 */
  function drawSpeedChart(canvas, curve) {
    var p = prep(canvas);
    var ctx = p.ctx, w = p.w, h = p.h;
    var pad = { l: 34, r: 12, t: 12, b: 20 };
    var iw = w - pad.l - pad.r;
    var ih = h - pad.t - pad.b;

    var accent = cssVar('--accent', '#ffc94a');
    var faint = cssVar('--text-faint', '#4d566e');
    var border = cssVar('--border', '#262c3e');
    var wrong = cssVar('--wrong', '#ff6b6b');

    if (!curve || !curve.length) {
      ctx.fillStyle = faint;
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillText('—', pad.l, pad.t + ih / 2);
      return;
    }

    var maxW = 0;
    curve.forEach(function (c) { if (c.wpm > maxW) maxW = c.wpm; });
    maxW = Math.max(maxW, 20) * 1.12;

    function X(i) { return pad.l + (curve.length <= 1 ? 0 : (i / (curve.length - 1)) * iw); }
    function Y(v) { return pad.t + ih - (v / maxW) * ih; }

    // 网格
    ctx.strokeStyle = border;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var g = 0; g <= 4; g++) {
      var y = pad.t + (ih / 4) * g;
      ctx.moveTo(pad.l, y);
      ctx.lineTo(pad.l + iw, y);
    }
    ctx.stroke();

    // y 轴刻度
    ctx.fillStyle = faint;
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'right';
    for (var k = 0; k <= 4; k++) {
      var val = Math.round(maxW - (maxW / 4) * k);
      ctx.fillText(String(val), pad.l - 6, pad.t + (ih / 4) * k + 3);
    }

    // 面积
    var grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ih);
    grad.addColorStop(0, hexA(accent, 0.28));
    grad.addColorStop(1, hexA(accent, 0.01));
    ctx.beginPath();
    ctx.moveTo(X(0), pad.t + ih);
    curve.forEach(function (c, i) { ctx.lineTo(X(i), Y(c.wpm)); });
    ctx.lineTo(X(curve.length - 1), pad.t + ih);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // 折线
    ctx.beginPath();
    curve.forEach(function (c, i) {
      if (i === 0) ctx.moveTo(X(i), Y(c.wpm));
      else ctx.lineTo(X(i), Y(c.wpm));
    });
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // 错误点
    if (curve.length > 1) {
      ctx.fillStyle = wrong;
      var prevErr = 0;
      curve.forEach(function (c, i) {
        if (c.err > prevErr) {
          ctx.beginPath();
          ctx.arc(X(i), Y(c.wpm), 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
        prevErr = c.err;
      });
    }

    // x 轴
    ctx.fillStyle = faint;
    ctx.textAlign = 'center';
    var step = Math.max(1, Math.ceil(curve.length / 8));
    for (var s = 0; s < curve.length; s += step) {
      ctx.fillText(curve[s].s + 's', X(s), h - 6);
    }
  }

  /** 错误累积线 */
  function drawErrorChart(canvas, errPoints, totalSeconds) {
    var p = prep(canvas);
    var ctx = p.ctx, w = p.w, h = p.h;
    var pad = { l: 30, r: 12, t: 10, b: 18 };
    var iw = w - pad.l - pad.r;
    var ih = h - pad.t - pad.b;

    var wrong = cssVar('--wrong', '#ff6b6b');
    var faint = cssVar('--text-faint', '#4d566e');
    var border = cssVar('--border', '#262c3e');

    ctx.strokeStyle = border;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t);
    ctx.lineTo(pad.l, pad.t + ih);
    ctx.lineTo(pad.l + iw, pad.t + ih);
    ctx.stroke();

    var maxT = Math.max(totalSeconds || 1, 1);

    if (!errPoints || !errPoints.length) {
      ctx.fillStyle = faint;
      ctx.font = '12px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('0', pad.l + 6, pad.t + ih / 2 + 4);
      return;
    }

    var maxC = errPoints[errPoints.length - 1].cum || 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t + ih);
    errPoints.forEach(function (e) {
      ctx.lineTo(pad.l + (e.t / maxT) * iw, pad.t + ih - (e.cum / maxC) * ih);
    });
    ctx.strokeStyle = wrong;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = faint;
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(String(maxC), 4, pad.t + 8);
    ctx.fillText('0', 4, pad.t + ih);
  }

  /** 逐键热力着色（返回 hex→css 颜色） */
  function heatColor(acc) {
    // acc 0-1，越低越红
    if (acc === null) return cssVar('--bg-input', '#10131d');
    var r, g, b;
    if (acc >= 0.98) { r = 0x19; g = 0x9c; b = 0x4a; }
    else if (acc >= 0.95) { r = 0x6d; g = 0xb8; b = 0x3c; }
    else if (acc >= 0.92) { r = 0xd4; g = 0xa0; b = 0x2c; }
    else if (acc >= 0.88) { r = 0xe8; g = 0x74; b = 0x22; }
    else { r = 0xe0; g = 0x31; b = 0x31; }
    return 'rgba(' + r + ',' + g + ',' + b + ',0.22)';
  }

  function hexA(hex, a) {
    hex = String(hex).trim();
    if (hex.charAt(0) !== '#') return hex;
    if (hex.length === 4) {
      hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
    }
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  return {
    summarize: summarize,
    grade: grade,
    drawSpeedChart: drawSpeedChart,
    drawErrorChart: drawErrorChart,
    heatColor: heatColor,
    hexA: hexA
  };
})();

</script>

<script>
/* =========================================================
   engine.js — 打字引擎
   TM.engine
   -----------------------------------------------------
   三种输入路径：
   1) 普通字符模式（英文 / 代码 / 符号）
   2) 编码跟打模式（中文：拼音或双拼字母逐键判定）
   3) IME 实测模式（中文：用系统输入法，整字校验）
   ========================================================= */
window.TM = window.TM || {};

TM.engine = (function () {
  'use strict';

  var util = TM.util;

  function create(opts) {
    var self = {};

    var cfg = {
      container: opts.container,
      target: opts.target || [],
      align: opts.align || null,      // target index → 原文字符 index
      hanChars: opts.hanChars || null, // 原文汉字（编码模式用于上方标注）
      groups: opts.groups || null,     // 字分组
      ime: !!opts.ime,
      allowBackspace: opts.allowBackspace !== false,
      stopOnError: !!opts.stopOnError,
      strictSpace: !!opts.strictSpace,
      showPinyin: opts.showPinyin !== false,
      pinyinHint: opts.pinyinHint || null,   // 数组，每个 target 位置对应的拼音提示
      autoNext: !!opts.autoNext,
      onUpdate: opts.onUpdate || function () {},
      onChar: opts.onChar || function () {},
      onWord: opts.onWord || function () {},
      onCursor: opts.onCursor || function () {},
      onFinish: opts.onFinish || function () {},
      onStart: opts.onStart || function () {},
      onRestart: opts.onRestart || function () {}
    };

    /* ---------- 状态 ---------- */
    var st = {
      typed: [],           // 每个 target 位置的输入结果：''(未输入) | 'ok' | 'bad'
      typedChar: [],       // 实际输入的字符
      cursor: 0,
      keystrokes: [],
      startTime: null,
      firstKeyTime: null,
      lastKeyTime: null,
      finished: false,
      started: false,
      cells: [],
      groupEls: [],
      mistakes: {},        // 期望字符 → 次数
      wrongIndexes: {}
    };

    var host = null;       // 容器
    var cellsWrap = null;  // 字符容器
    var imeInput = null;   // IME 隐藏输入框
    var rafId = null;

    /* ================= 渲染 ================= */

    function clear() {
      if (cellsWrap && cellsWrap.parentNode) cellsWrap.parentNode.removeChild(cellsWrap);
      cellsWrap = null;
      st.cells = [];
      st.groupEls = [];
    }

    function renderPlain() {
      cellsWrap = util.el('div', { class: 'flow-inner' });
      var frag = document.createDocumentFragment();

      cfg.target.forEach(function (ch, i) {
        var isSpace = ch === ' ';
        var node = util.el('span', {
          class: 'ch pending' + (isSpace ? ' sp' : ''),
          'data-i': i
        }, ch);
        st.cells.push(node);
        frag.appendChild(node);
      });

      cellsWrap.appendChild(frag);
      host.appendChild(cellsWrap);
    }

    function renderGroups() {
      cellsWrap = util.el('div', { class: 'flow-inner grp-flow' });
      var frag = document.createDocumentFragment();
      var idx = 0;

      // 按 target 顺序遍历，用 groups 信息切分
      var byStart = {};
      (cfg.groups || []).forEach(function (g) { byStart[g.start] = g; });

      while (idx < cfg.target.length) {
        var g = byStart[idx];

        if (g) {
          var grpEl = util.el('span', { class: 'grp', 'data-g': g.charIndex });
          var hanChar = cfg.hanChars ? cfg.hanChars[g.charIndex] : '';
          if (hanChar && util.isCJK(hanChar)) {
            grpEl.appendChild(util.el('span', { class: 'grp-han' }, hanChar));
          } else if (hanChar) {
            grpEl.appendChild(util.el('span', { class: 'grp-han punct' }, ''));
          } else {
            grpEl.appendChild(util.el('span', { class: 'grp-han' }, ''));
          }

          var codeWrap = util.el('span', { class: 'grp-code' });
          for (var i = g.start; i < g.end; i++) {
            var c = util.el('span', {
              class: 'ch pending',
              'data-i': i,
              'data-g': g.charIndex
            }, cfg.target[i]);
            st.cells.push(c);
            codeWrap.appendChild(c);
          }
          grpEl.appendChild(codeWrap);
          frag.appendChild(grpEl);
          st.groupEls.push({ el: grpEl, charIndex: g.charIndex, start: g.start, end: g.end });
          idx = g.end;
        } else {
          // 孤立字符（音节间空格、标点）
          var sp = util.el('span', { class: 'ch pending sp', 'data-i': idx }, cfg.target[idx] === ' ' ? ' ' : cfg.target[idx]);
          st.cells.push(sp);
          frag.appendChild(sp);
          idx++;
        }
      }

      cellsWrap.appendChild(frag);
      host.appendChild(cellsWrap);
    }

    function render() {
      clear();
      if (cfg.ime) renderImeHost();
      else if (cfg.groups && cfg.groups.length) renderGroups();
      else renderPlain();
      host.setAttribute('tabindex', '0');
      updateCaret();
    }

    /* ---------- IME 模式：隐藏输入框 ---------- */
    function renderImeHost() {
      cellsWrap = util.el('div', { class: 'flow-inner ime-flow' });
      var frag = document.createDocumentFragment();

      cfg.target.forEach(function (ch, i) {
        var node = util.el('span', {
          class: 'ch pending' + (ch === ' ' ? ' sp' : ''),
          'data-i': i
        }, ch);
        st.cells.push(node);
        frag.appendChild(node);
      });
      cellsWrap.appendChild(frag);
      host.appendChild(cellsWrap);

      imeInput = util.el('input', {
        class: 'ime-input',
        type: 'text',
        autocomplete: 'off',
        autocorrect: 'off',
        autocapitalize: 'off',
        spellcheck: 'false',
        'aria-label': 'typing input'
      });
      host.appendChild(imeInput);
      bindIme();
    }

    /* ================= 光标与高亮 ================= */

    function updateCaret() {
      var prev = host.querySelectorAll('.ch.caret');
      Array.prototype.forEach.call(prev, function (n) { n.classList.remove('caret'); });

      var cur = st.cells[st.cursor];
      if (cur && !st.finished) {
        cur.classList.add('caret');
        // 分组模式下让整个组高亮
        var g = cur.getAttribute('data-g');
        Array.prototype.forEach.call(host.querySelectorAll('.grp.active'), function (n) { n.classList.remove('active'); });
        if (g !== null) {
          var gEl = host.querySelector('.grp[data-g="' + g + '"]');
          if (gEl) gEl.classList.add('active');
        }
      }
      scrollCaretIntoView(cur);

      // 光标位置变化（打字 / 退格 / IME 提交）都要通知外部，
      // 否则退格后下方键盘提示不会跟着退回来。
      try {
        cfg.onCursor(st.cursor, cfg.target[st.cursor] || null);
      } catch (e) { /* 不影响打字 */ }
    }

    function scrollCaretIntoView(node) {
      if (!node || !nodescrollAvailable()) return;
      var box = host;
      var nr = node.offsetTop;
      var h = box.clientHeight;
      var top = box.scrollTop;
      if (nr < top + h * 0.25) box.scrollTop = Math.max(0, nr - h * 0.25);
      else if (nr > top + h * 0.72) box.scrollTop = nr - h * 0.72;
    }

    function nodescrollAvailable() {
      return host.scrollHeight > host.clientHeight + 4;
    }

    /* ================= 输入处理 ================= */

    function now() {
      return (window.performance && performance.now) ? performance.now() : Date.now();
    }

    function ensureStart() {
      if (st.started) return;
      st.started = true;
      st.startTime = now();
      st.lastKeyTime = st.startTime;
      host.classList.add('typing');
      cfg.onStart();
      startTicker();
    }

    function startTicker() {
      if (rafId) return;
      var tick = function () {
        if (st.finished) { rafId = null; return; }
        cfg.onUpdate(liveStats());
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }

    function stopTicker() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    /** 实时统计数据 */
    function liveStats() {
      var elapsed = st.startTime ? (now() - st.startTime) / 1000 : 0;
      var ok = 0, bad = 0;
      for (var i = 0; i < st.cursor; i++) {
        if (st.typed[i] === 'ok') ok++;
        else if (st.typed[i] === 'bad') bad++;
      }
      var total = st.keystrokes.length;
      var okKeys = 0;
      for (var k = 0; k < total; k++) if (st.keystrokes[k].ok) okKeys++;

      var minutes = Math.max(elapsed / 60, 1 / 600);
      var progress = cfg.target.length ? (st.cursor / cfg.target.length) : 0;

      return {
        elapsed: elapsed,
        progress: progress,
        cursor: st.cursor,
        total: cfg.target.length,
        correct: ok,
        wrong: bad,
        wpm: Math.round((ok / 5) / minutes),
        rawWpm: Math.round((total / 5) / minutes),
        cpm: Math.round(ok / minutes),
        accuracy: total ? util.round((okKeys / total) * 100, 1) : 100,
        finished: st.finished
      };
    }

    /** 记录一次按键 */
    function logKey(ch, expected, ok, code) {
      var t = now();
      var gap = st.lastKeyTime ? (t - st.lastKeyTime) : 0;
      st.lastKeyTime = t;

      st.keystrokes.push({ t: t, ok: ok, code: code || null, char: ch, expected: expected || null });

      if (code) TM.store.recordKey(code, ok, gap);

      if (!ok) {
        var key = expected || ch;
        st.mistakes[key] = (st.mistakes[key] || 0) + 1;
      }

      cfg.onChar(st.cursor, ok, code, ch, expected);
    }

    /** 输入一个字符（普通 / 编码模式） */
    function typeChar(ch, ev) {
      if (st.finished) return;
      if (st.cursor >= cfg.target.length) return;

      ensureStart();

      var expected = cfg.target[st.cursor];
      var isSpaceTarget = expected === ' ';

      // 严格空格：空格错也判定
      var ok;
      if (isSpaceTarget) {
        ok = (ch === ' ');
      } else if (ch === ' ') {
        // 目标不是空格却打了空格
        ok = !cfg.strictSpace;
        if (!cfg.strictSpace) {
          // 非严格模式：忽略多余空格，不算错误也不前进
          logKey(ch, expected, true, 'Space');
          cfg.onUpdate(liveStats());
          return;
        }
      } else {
        ok = (ch === expected);
      }

      // stopOnError：一旦当前位已错，必须先改正
      if (cfg.stopOnError && st.typed[st.cursor] === 'bad' && !ok) {
        flashError(st.cursor);
        return;
      }

      var code = null;
      var mapped = TM.keyboard.charToKey(ch);
      if (mapped) code = mapped.code;

      logKey(ch, expected, ok, code);

      st.typed[st.cursor] = ok ? 'ok' : 'bad';
      st.typedChar[st.cursor] = ch;

      var cell = st.cells[st.cursor];
      if (cell) {
        cell.classList.remove('pending', 'correct', 'wrong');
        cell.classList.add(ok ? 'correct' : 'wrong');
        if (ok) cell.classList.remove('caret');
      }
      if (!ok) st.wrongIndexes[st.cursor] = true;

      // 发音点位（完成一个字的所有编码）
      var prevG = groupAt(st.cursor);
      st.cursor++;
      var nextG = groupAt(st.cursor);
      if (prevG !== null && nextG !== prevG) {
        cfg.onWord(prevG);
      }

      updateCaret();
      cfg.onUpdate(liveStats());

      if (st.cursor >= cfg.target.length) finish();
    }

    function flashError(i) {
      var cell = st.cells[i];
      if (!cell) return;
      cell.classList.add('wrong');
      cell.animate && cell.animate(
        [{ transform: 'translateX(0)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(3px)' }, { transform: 'translateX(0)' }],
        { duration: 140 }
      );
    }

    function groupAt(targetIndex) {
      if (!cfg.groups) return null;
      for (var i = 0; i < cfg.groups.length; i++) {
        var g = cfg.groups[i];
        if (targetIndex >= g.start && targetIndex < g.end) return g.charIndex;
      }
      return null;
    }

    /** 退格 */
    function backspace(word) {
      if (!cfg.allowBackspace) return;
      if (st.finished) return;
      if (st.cursor === 0) return;

      if (word) {
        // 删到上一个分隔点
        var i = st.cursor - 1;
        while (i > 0 && cfg.target[i - 1] !== ' ') i--;
        clearRange(i, st.cursor);
        st.cursor = i;
      } else {
        st.cursor--;
        clearRange(st.cursor, st.cursor + 1);
      }

      ensureStart();
      st.keystrokes.push({ t: now(), ok: true, code: 'Backspace', char: null, expected: null, back: true });
      st.lastKeyTime = now();
      updateCaret();
      cfg.onUpdate(liveStats());
    }

    function clearRange(from, to) {
      for (var i = from; i < to; i++) {
        st.typed[i] = '';
        st.typedChar[i] = '';
        delete st.wrongIndexes[i];
        var cell = st.cells[i];
        if (cell) {
          cell.classList.remove('correct', 'wrong', 'extra');
          cell.classList.add('pending');
        }
      }
    }

    /* ---------- IME ---------- */
    function bindIme() {
      if (!imeInput) return;

      var composing = false;

      imeInput.addEventListener('compositionstart', function () { composing = true; });
      imeInput.addEventListener('compositionend', function () {
        composing = false;
        syncIme();
      });
      imeInput.addEventListener('input', function () {
        if (!composing) syncIme();
      });
      imeInput.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && imeInput.value === '') {
          e.preventDefault();
          backspace(false);
        }
      });
      // 点击文字区聚焦输入框
      host.addEventListener('mousedown', function (e) {
        if (e.target === host || host.contains(e.target)) {
          setTimeout(function () { imeInput.focus(); }, 0);
        }
      });
    }

    /** IME 模式下把 input.value 与目标逐字比对 */
    function syncIme() {
      var val = imeInput.value;
      // 只保留到目标长度
      if (val.length > cfg.target.length) {
        val = val.slice(0, cfg.target.length);
      }

      ensureStart();

      var i;
      // 逐位校验
      for (i = 0; i < val.length; i++) {
        var ch = val[i];
        var expected = cfg.target[i];
        var ok = (ch === expected);
        var prev = st.typed[i];

        if (prev !== (ok ? 'ok' : 'bad') || st.typedChar[i] !== ch) {
          st.typed[i] = ok ? 'ok' : 'bad';
          st.typedChar[i] = ch;
          if (!ok) {
            st.wrongIndexes[i] = true;
            st.mistakes[expected] = (st.mistakes[expected] || 0) + 1;
          }
          var cell = st.cells[i];
          if (cell) {
            cell.classList.remove('pending', 'correct', 'wrong');
            cell.classList.add(ok ? 'correct' : 'wrong');
          }
          st.keystrokes.push({ t: now(), ok: ok, code: null, char: ch, expected: expected });
          st.lastKeyTime = now();
        }
      }

      // 被删掉的位
      if (val.length < st.cursor) {
        clearRange(val.length, st.cursor);
      }

      var prevCursor = st.cursor;
      st.cursor = val.length;

      if (st.cursor > prevCursor) cfg.onWord(st.cursor - 1);

      updateCaret();
      cfg.onUpdate(liveStats());

      if (st.cursor >= cfg.target.length && val.length >= cfg.target.length) finish();
    }

    /* ================= 结束 ================= */

    function finish() {
      if (st.finished) return;
      st.finished = true;
      stopTicker();

      var elapsed = st.startTime ? (now() - st.startTime) / 1000 : 0;

      var ok = 0, bad = 0;
      for (var i = 0; i < cfg.target.length; i++) {
        if (st.typed[i] === 'ok') ok++;
        else if (st.typed[i] === 'bad') bad++;
      }

      var groupDone = 0;
      if (cfg.groups) {
        cfg.groups.forEach(function (g) {
          var allOk = true, anyTyped = false;
          for (var k = g.start; k < g.end; k++) {
            if (st.typed[k]) anyTyped = true;
            if (st.typed[k] !== 'ok') { allOk = false; break; }
          }
          if (allOk && anyTyped) groupDone++;
        });
      }

      var run = {
        keystrokes: st.keystrokes,
        elapsed: elapsed,
        correctChars: ok,
        wrongChars: bad,
        totalTarget: cfg.target.length,
        groupDone: groupDone,
        hasGroups: !!cfg.groups,
        mistakes: st.mistakes,
        wrongIndexes: st.wrongIndexes,
        target: cfg.target,
        typedChar: st.typedChar.slice()
      };

      host.classList.remove('typing');

      cfg.onUpdate(liveStats());

      if (cfg.autoNext) {
        setTimeout(function () { cfg.onFinish(run); }, 260);
      } else {
        cfg.onFinish(run);
      }
    }

    /* ================= 键事件 ================= */

    /** 只在自己所属的视图可见、且没有弹层时才响应按键 */
    function isActive() {
      if (!host || !host.isConnected) return false;
      var v = host.closest ? host.closest('.view') : null;
      if (v && v.hidden) return false;
      // 抽屉 / 弹窗打开时让出键盘
      if (document.querySelector('.drawer:not([hidden]), .modal-mask:not([hidden])')) return false;
      return true;
    }

    /** 是否正在别的输入控件里打字（设置、自定义文本等） */
    function isForeignInput(node) {
      if (!node || node === imeInput) return false;
      var tag = node.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (node.isContentEditable) return true;
      return false;
    }

    function onKeyDown(e) {
      if (!isActive()) return;
      if (isForeignInput(e.target)) return;
      if (e.metaKey || e.altKey || (e.ctrlKey && e.key !== 'Backspace')) return;

      // 全局控制键
      if (e.key === 'Tab') {
        e.preventDefault();
        restart();
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        if (st.started && !st.finished) finish();
        return;
      }

      if (cfg.ime) {
        // IME 模式由 input 事件处理，只接管退格
        if (e.key === 'Backspace') {
          if (!cfg.allowBackspace) { e.preventDefault(); return; }
          if (imeInput && imeInput.value === '') {
            e.preventDefault();
            backspace(false);
          }
        }
        return;
      }

      if (e.key === 'Backspace') {
        e.preventDefault();
        if (!cfg.allowBackspace) {
          cfg.onChar(-1, false, 'Backspace', null, null);
          return;
        }
        backspace(e.ctrlKey || e.altKey);
        return;
      }

      // Enter：只有当目标是换行符时才作为输入（代码模式）
      if (e.key === 'Enter') {
        e.preventDefault();
        if (cfg.target[st.cursor] === '\n') {
          typeChar('\n', e);
        }
        return;
      }

      if (e.key.length === 1) {
        e.preventDefault();
        typeChar(e.key, e);
      }
    }

    function restart() {
      st.typed = [];
      st.typedChar = [];
      st.cursor = 0;
      st.keystrokes = [];
      st.startTime = null;
      st.firstKeyTime = null;
      st.lastKeyTime = null;
      st.finished = false;
      st.started = false;
      st.mistakes = {};
      st.wrongIndexes = {};

      stopTicker();
      render();
      if (cfg.ime && imeInput) {
        imeInput.value = '';
        imeInput.focus();
      }
      cfg.onRestart();
      cfg.onUpdate(liveStats());
    }

    /** 换一段新文本（不触发重启回调语义） */
    function load(newCfg) {
      if (newCfg.target) cfg.target = newCfg.target;
      if (newCfg.align !== undefined) cfg.align = newCfg.align;
      if (newCfg.hanChars !== undefined) cfg.hanChars = newCfg.hanChars;
      if (newCfg.groups !== undefined) cfg.groups = newCfg.groups;
      if (newCfg.ime !== undefined) {
        cfg.ime = !!newCfg.ime;
        imeInput = null;
      }
      restart();
    }

    function mount() {
      host = cfg.container;
      host.innerHTML = '';
      // 监听 document：打字站不该要求用户先精确点到文字区
      document.addEventListener('keydown', onKeyDown);
      render();
      cfg.onUpdate(liveStats());
      return self;
    }

    function focus() {
      if (cfg.ime && imeInput) imeInput.focus();
      else if (host && host.focus) host.focus();
    }

    function destroy() {
      stopTicker();
      document.removeEventListener('keydown', onKeyDown);
      clear();
    }

    function getMistakes() { return st.mistakes; }
    function getRaw() { return st; }
    function isFinished() { return st.finished; }

    self.mount = mount;
    self.restart = restart;
    self.load = load;
    self.focus = focus;
    self.destroy = destroy;
    self.finish = finish;
    self.liveStats = liveStats;
    self.getMistakes = getMistakes;
    self.getRaw = getRaw;
    self.isFinished = isFinished;
    self.cfg = cfg;

    return self;
  }

  return { create: create };
})();

<script>
/* =========================================================
   adaptive.js — Keybr 式自适应弱键训练
   TM.adaptive
   -----------------------------------------------------
   思路：
   1. 取逐键准确率与平均反应时间，算出每个键的"掌握度"
   2. 未达标的键 = 当前焦点键，刻意加大比重
   3. 已掌握的键达标后，把新键放进训练池
   4. 英文生成可发音伪词，中文按音节组合出题
   ========================================================= */
window.TM = window.TM || {};

TM.adaptive = (function () {
  'use strict';

  var util = TM.util;

  /* ---------- 默认训练顺序（按教学顺序，不是字母表） ---------- */
  var EN_ORDER = 'fjdk sla; gh ei ru ty wo qp vm c, x. z/ bn'.replace(/\s/g, '').split('');
  var EN_POOL = 'abcdefghijklmnopqrstuvwxyz'.split('');
  var VOWELS = 'aeiou'.split('');

  var MASTERY = {
    minSamples: 6,      // 至少敲够这么多次才参与判断
    goodAcc: 0.94,      // 准确率达标线
    goodLatency: 420    // 平均反应时间达标线（ms）
  };

  /**
   * 评估一个键的掌握度
   * @returns {object|null} null 表示样本不足
   */
  function keyMastery(code) {
    var acc = TM.store.keyAccuracy(code, MASTERY.minSamples);
    if (acc === null) return null;
    var lat = TM.store.keyLatency(code) || 600;
    var accScore = util.clamp((acc - 0.75) / (MASTERY.goodAcc - 0.75), 0, 1);
    var latScore = util.clamp((900 - lat) / (900 - MASTERY.goodLatency), 0, 1);
    return {
      code: code,
      acc: acc,
      latency: lat,
      score: util.round((accScore * 0.68 + latScore * 0.32) * 100, 1),
      good: acc >= MASTERY.goodAcc && lat <= MASTERY.goodLatency
    };
  }

  /**
   * 当前该练哪些键
   * 返回 { focus:[], pool:[], unlocked:[], mastered:[] }
   */
  function analyze() {
    var focus = [];
    var mastered = [];
    var pending = [];

    EN_ORDER.forEach(function (code) {
      var m = keyMastery(code);
      if (m === null) { pending.push(code); return; }
      if (m.good) mastered.push(code);
      else focus.push(m);
    });

    focus.sort(function (a, b) { return a.score - b.score; });

    // 训练池 = 已解锁的键（首次进入给前 8 个基准键）
    var unlocked = EN_ORDER.slice();
    if (!mastered.length && !focus.length) {
      unlocked = EN_ORDER.slice(0, 8);
    } else {
      // 已掌握 + 焦点键 + 下一个待解锁键
      var known = mastered.concat(focus.map(function (f) { return f.code; }));
      var nextIdx = 0;
      for (var i = 0; i < EN_ORDER.length; i++) {
        if (known.indexOf(EN_ORDER[i]) !== -1) nextIdx = i + 1;
      }
      unlocked = EN_ORDER.slice(0, Math.min(EN_ORDER.length, nextIdx + 2));
    }

    return {
      focus: focus,
      focusCodes: focus.map(function (f) { return f.code; }),
      mastered: mastered,
      pending: pending,
      pool: unlocked.length ? unlocked : EN_ORDER.slice(0, 8),
      progress: util.round((mastered.length / EN_ORDER.length) * 100, 1)
    };
  }

  /* ---------- 英文伪词生成 ---------- */

  function isVowel(c) { return VOWELS.indexOf(c) !== -1; }

  /**
   * 生成一个可发音的伪词
   * @param {string[]} pool 允许使用的字母
   * @param {string[]} focus 需要加权的字母
   */
  function fakeWord(pool, focus) {
    // 只允许单字母键参与拼词（排除 ';' '/' 等符号键）
    pool = (pool || []).filter(function (c) { return /^[a-z]$/.test(c); });
    focus = (focus || []).filter(function (c) { return /^[a-z]$/.test(c); });
    if (!pool.length) pool = EN_POOL.slice();

    var pickFrom = function (set) { return set[Math.floor(Math.random() * set.length)]; };

    // 70% 概率从焦点字母里挑
    function pickLetter(vowelWanted) {
      if (focus.length && Math.random() < 0.7) {
        var focused = focus.filter(function (c) {
          return vowelWanted ? isVowel(c) : !isVowel(c);
        });
        if (focused.length) return pickFrom(focused);
      }
      var set = pool.filter(function (c) {
        return vowelWanted ? isVowel(c) : !isVowel(c);
      });
      if (!set.length) set = pool;
      return pickFrom(set);
    }

    var shape = util.pick([
      'cv', 'cvc', 'cvcv', 'cvcc', 'ccvc', 'cvccv', 'vcv', 'cvvc', 'ccvcc', 'cvcvc'
    ]);

    var out = '';
    for (var i = 0; i < shape.length; i++) {
      out += pickLetter(shape[i] === 'v');
    }
    return out;
  }

  /**
   * 生成英文自适应练习串
   * @param {number} count 词数
   */
  function generateEn(count) {
    count = count || 22;
    var a = analyze();
    var isLetter = function (c) { return /^[a-z]$/.test(c); };
    var pool = a.pool.filter(isLetter);
    var focus = a.focusCodes.filter(isLetter).slice(0, 4);

    // 焦点键太少时，把样本不足的键也拿来练
    if (focus.length < 2) {
      focus = focus.concat(a.pending.filter(isLetter).slice(0, 3));
    }

    var words = [];
    for (var i = 0; i < count; i++) {
      var w = fakeWord(pool, focus);
      // 每 5 个穿插一次焦点键的强化串
      if (i > 0 && i % 5 === 0 && focus.length) {
        var f = util.pick(focus);
        words.push(f + f + f + f);
      }
      words.push(w);
    }

    return {
      text: words.join(' '),
      focus: focus,
      analysis: a
    };
  }

  /* ---------- 中文音节出题 ---------- */

  var ZH_FOCUS_SYL = ('ji qi xi zhi chi shi zi ci si ni li yi wu yu ju qu xu nv lv de te ne le ge ke he zhe che she ren shen chen zhen zeng ceng seng zong cong song jin jing qin qing xin xing zhang chang shang zhan chan shan zhuang chuang shuang gua kua hua guo kuo huo dui tui gui kui hui zui cui sui bie pie mie die tie nie lie jie qie xie').split(' ');

  /**
   * 中文自适应：围绕易错音节生成词组练习
   */
  function generateZhSyllables(count) {
    count = count || 20;
    var a = analyze();

    // 找出包含焦点字母的音节
    var focusLetters = a.focusCodes.filter(function (c) { return /^[a-z]$/.test(c); });
    var candidates = TM.pinyin.ALL_SYLLABLES;

    if (focusLetters.length) {
      var matched = candidates.filter(function (s) {
        for (var i = 0; i < focusLetters.length; i++) {
          if (s.indexOf(focusLetters[i]) !== -1) return true;
        }
        return false;
      });
      if (matched.length > 12) candidates = matched;
    }

    var out = [];
    for (var i = 0; i < count; i++) {
      out.push(util.pick(candidates));
    }

    return {
      p: out.join(' '),
      t: null,
      focus: focusLetters,
      analysis: a
    };
  }

  /** 给结果页生成一句针对性建议 */
  function advice(weakList, lang) {
    if (!weakList || !weakList.length) {
      return lang === 'zh'
        ? '目前没有明显弱键 — 试试提高速度目标。'
        : 'No obvious weak keys — try raising your speed target.';
    }
    var top = weakList.slice(0, 3).map(function (w) {
      return displayKey(w.code);
    }).join(' / ');

    if (lang === 'zh') {
      return '建议专练这几个键：' + top + '。用「自适应」模式，它会自动加大这些键的比重。';
    }
    return 'Drill these keys: ' + top + '. Adaptive mode weights them automatically.';
  }

  /** code → 可读字符 */
  function displayKey(code) {
    if (!code) return '?';
    if (code === 'Space') return 'space';
    if (code === 'ShiftLeft') return '⇧L';
    if (code === 'ShiftRight') return '⇧R';
    return code.length === 1 ? code : code;
  }

  return {
    EN_ORDER: EN_ORDER,
    MASTERY: MASTERY,
    analyze: analyze,
    keyMastery: keyMastery,
    fakeWord: fakeWord,
    generateEn: generateEn,
    generateZhSyllables: generateZhSyllables,
    advice: advice,
    displayKey: displayKey
  };
})();

</script>

    cell(t('result.wpmRaw'), summary.rawWpm);

    cell(t('result.consistency'), summary.consistency + '%',

    box.appendChild(grid);

    /* --- 图表 --- */
    var charts = el('div', { class: 'res-charts' });

  function renderLessons(onPick) {

          : (lang === 'zh' ? '综合练习' : 'Review');

  /* =========================================================
     4. 统计页
     ========================================================= */
  function renderStats() {
    var lang = TM.i18n.get();
    var hist = TM.store.history();
    var wrap = el('div');

    wrap.appendChild(el('div', { class: 'page-head' }, [
      el('h1', {}, t('stats.title')),
      el('p', {}, t('stats.subtitle'))
    ]));

    if (!hist.length) {
      wrap.appendChild(el('div', { class: 'panel empty-state' }, [
        el('div', { class: 'big' }, '⌨'),
        el('div', {}, t('stats.noHistory'))
      ]));
      return wrap;
    }

    /* ---- Hero 指标 ---- */
    var all = hist;
    var totalMs = 0, sumWpm = 0, sumAcc = 0, best = 0;
    all.forEach(function (h) {
      totalMs += (h.elapsed || 0) * 1000;
      sumWpm += (h.wpm || 0);
      sumAcc += (h.accuracy || 0);
      if ((h.wpm || 0) > best) best = h.wpm;
    });

    var avgWpm = Math.round(sumWpm / all.length);
    var avgAcc = util.round(sumAcc / all.length, 1);
    var totalH = totalMs / 3600000;

    var hero = el('div', { class: 'stat-hero' });
    function sb(v, k, d) {
      hero.appendChild(el('div', { class: 'stat-box' }, [
        el('div', { class: 'v' }, String(v)),
        el('div', { class: 'k' }, k),

<script>
/* =========================================================
   games.js — 五款打字游戏
   TM.games
   -----------------------------------------------------
   全部基于 Canvas 2D，共享同一套循环 / 计分 / 输入框架
   ========================================================= */
window.TM = window.TM || {};

TM.games = (function () {
  'use strict';

  var util = TM.util;
  var el = util.el;
